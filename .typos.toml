[default]
extend-ignore-words = ["CANN", "ASO", "fre", "wqs", "hsa", "ue"]

[default.extend-words]
CANN = "CANN"
ASO = "ASO"
fre = "fre"
wqs = "wqs"
# AMD HSA runtime symbol prefix (hsa_*, hsaRes, hsaErr, etc.) — used by the
# ROCm dmabuf MR registration path.
hsa = "hsa"
# SYCL ND-range types (sycl::nd_item, sycl::nd_range) -- used by the XPU EP
# kernels.
nd = "nd"
Optin = "Optin"
HPE = "HPE"

[default.extend-identifiers]
# CPython buffer protocol flag from the Python C API.
PyBUF_ND = "PyBUF_ND"

[files]
extend-exclude = [
  "mooncake-transfer-engine/tent/include/tent/thirdparty/nlohmann/json.h",
  # DeepEP-derived elastic kernel headers keep upstream identifiers such as
  # `ue8m0x4`; exclude the imported header block from spelling checks.
  "mooncake-ep/include/elastic/*",
  # Conductor hash golden vectors are generated digests and pickle byte
  # dumps; hex runs collide with dictionary words. The generator scripts
  # stay checked.
  "mooncake-conductor/tests/fixtures/*.json",
]
