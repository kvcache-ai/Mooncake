name: Free runner disk space
description: Remove preinstalled toolchains that Mooncake CI does not use

runs:
  using: composite
  steps:
    - name: Remove unused runner tools
      shell: bash
      run: |
        sudo rm -rf -- \
          /usr/share/dotnet \
          /opt/ghc \
          /opt/hostedtoolcache/CodeQL \
          /usr/local/lib/android
        # Build-flags TE scratch lives on /mnt (larger than /) when jobs opt in.
        sudo mkdir -p /mnt/mooncake-build-flags-te
        df -h
