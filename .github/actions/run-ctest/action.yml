name: Run Mooncake CTest suite
description: Run and validate the source-build CTest suite with shared runtime settings
inputs:
  reserve-rpc-port:
    description: Reserve the Mooncake client RPC port from ephemeral allocation
    default: 'true'
  junit-report:
    description: Repository-relative JUnit output path (defaults to build/test-results/ctest.xml)
    default: ''
  label-exclude:
    description: Optional CTest label regex to exclude
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RESERVE_RPC_PORT: ${{ inputs.reserve-rpc-port }}
        JUNIT_REPORT: ${{ inputs.junit-report }}
        CTEST_LABEL_EXCLUDE: ${{ inputs.label-exclude }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
