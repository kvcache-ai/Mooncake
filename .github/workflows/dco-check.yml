name: DCO Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: dco-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    name: Developer Certificate of Origin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Keep this outside process substitution so an invalid range fails.
          commits=$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")
          identity_pattern='^.+ <[^<>[:space:]@]+@[^<>[:space:]@]+>$'
          failed=0
          while IFS= read -r sha; do
            [[ -z "$sha" ]] && continue

            author=$(git show -s --format='%an <%ae>' "$sha")
            signoffs=$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")
            if [[ ! "$author" =~ $identity_pattern ]] || ! grep -Fxq -- "$author" <<< "$signoffs"; then
              echo "::error::Commit $sha is missing a valid Signed-off-by trailer matching its author."
              failed=1
            fi
          done <<< "$commits"

          if [[ "$failed" -eq 1 ]]; then
            echo "Every non-merge commit must contain a trailer matching its author's name and email:"
            echo "  Signed-off-by: Your Name <your.email@example.com>"
            echo "Create signed-off commits with: git commit -s"
            echo "For your latest commit, after reading the DCO: git commit --amend --no-edit -s"
            echo "For already-pushed commits, coordinate before rewriting history."
            echo "See CONTRIBUTING.md and https://developercertificate.org/"
            exit 1
          fi

          echo "All non-merge commits have valid DCO sign-offs."
