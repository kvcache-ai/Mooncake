name: campaign-gpu-canary-i141135
# Transient benign CI canary for authorized campaign validation (intent 141135).
on:
  pull_request:
permissions:
  contents: read
jobs:
  runner-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: control
        run: |
          echo "CAMPAIGN-CONTROL i141135 runner=$(hostname)"
  gpu-canary:
    runs-on: [self-hosted, Linux, X64, hcu1]
    timeout-minutes: 10
    steps:
      - name: gpu-probe
        run: |
          echo "CAMPAIGN-CANARY i141135 host=$(hostname) user=$(id -un)"
          nvidia-smi -L || true
          hygon-smi || true
          rocm-smi --showproductname 2>/dev/null || true
          lspci 2>/dev/null | grep -Ei 'display|3d|processing|co-processor' || true
          ls -l /dev/kfd /dev/dri 2>/dev/null || true
          uname -a || true
