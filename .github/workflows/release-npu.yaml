name: Release Ascend NPU

on:
  push:
    tags:
      - 'v*'
      - '!v*-*'
      - '!v*.post*'
      - 'npu-v*'
      - '!npu-v*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.14, v0.3.14.post1, or npu-v0.3.14.post1)'
        required: true
        type: string

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        ((startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') && !contains(github.ref_name, '.post')) ||
         startsWith(github.ref_name, 'npu-v')))

    strategy:
      max-parallel: 2
      matrix:
        arch: [aarch64, x86_64]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        include:
          - arch: aarch64
            runner: ubuntu-22.04-arm
            cann_arch: aarch64
          - arch: x86_64
            runner: ubuntu-22.04
            cann_arch: x86_64

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    env:
      NPU_BUILD: "1"
      GOEXPERIMENT: "norandomizedheapbase64"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Align wheel version with release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^(npu-)?v([0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?)$ ]]; then
            echo "::error::Invalid release tag '${RELEASE_TAG}'"
            exit 1
          fi
          VERSION="${BASH_REMATCH[2]}"
          CUR="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' mooncake-wheel/pyproject.toml | head -n 1)"
          if [[ "${RELEASE_TAG}" == npu-v* ]]; then
            [[ "${VERSION%%.post*}" == "${CUR%%.post*}" ]] || { echo "::error::Tag ${VERSION} does not match pyproject base ${CUR}"; exit 1; }
            sed -i "s/^version = \"[^\"]*\"$/version = \"${VERSION}\"/" mooncake-wheel/pyproject.toml
          elif [[ "${CUR}" != "${VERSION}" ]]; then
            echo "::error::Tag ${VERSION} does not match pyproject ${CUR}"
            exit 1
          fi

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set Python bin
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python${{ matrix.python-version }})"
          "$PYTHON_BIN" --version
          "$PYTHON_BIN" -m pip --version
          echo "PYTHON_BIN=${PYTHON_BIN}" >> "$GITHUB_ENV"

      - name: Install CANN Toolkit
        shell: bash
        run: |
          set -euo pipefail
          CANN_BASE_URL="https://ascend.devcloud.huaweicloud.com/cann/run/software"
          CANN_VERSION=$(curl -s "${CANN_BASE_URL}/" | grep -oP '[0-9]+\.[0-9]+\.[0-9]+(?=/)' | sort -V | tail -1)
          echo "Latest CANN version: ${CANN_VERSION}"
          CANN_URL="${CANN_BASE_URL}/${CANN_VERSION}/${{ matrix.cann_arch }}/Ascend-cann-toolkit_${CANN_VERSION}_linux-${{ matrix.cann_arch }}.run"
          echo "Downloading CANN ${CANN_VERSION} from ${CANN_URL}"
          wget -q --show-progress -O /tmp/cann_toolkit.run "${CANN_URL}"
          chmod +x /tmp/cann_toolkit.run
          sudo /tmp/cann_toolkit.run --install --install-for-all --install-path=/usr/local/Ascend --quiet
          rm -f /tmp/cann_toolkit.run

      - name: Build and install HIXL
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
          source /usr/local/Ascend/cann/set_env.sh
          sudo ${PYTHON_BIN} -m pip install setuptools
          cd /tmp
          git clone https://gitcode.com/cann/hixl.git
          cd hixl
          bash build.sh -j$(nproc)
          sudo ./build_out/cann-hixl_*.run --full --quiet --pylocal --install-path=/usr/local/Ascend

      - name: Install dependencies
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
          source /usr/local/Ascend/cann/set_env.sh
          sudo bash -x dependencies.sh -y
          sudo bash scripts/ascend/dependencies_ascend_installation.sh
          echo "PATH=/usr/local/go/bin:${PATH}" >> "$GITHUB_ENV"

      - name: Configure project
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
          source /usr/local/Ascend/cann/set_env.sh
          rm -rf build
          mkdir build
          cd build
          cmake_args=(
            -DWITH_CONDUCTOR=ON
            -DUSE_ASCEND_DIRECT=ON
            -DUSE_ETCD=ON
            -DSTORE_USE_ETCD=ON
            -DBUILD_UNIT_TESTS=OFF
            -DCMAKE_BUILD_TYPE=Release
            -DPython3_EXECUTABLE="${PYTHON_BIN}"
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=OFF
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=OFF
            -DCMAKE_SKIP_INSTALL_RPATH=ON
          )
          cmake .. "${cmake_args[@]}"

      - name: Build project
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
          source /usr/local/Ascend/cann/set_env.sh
          export PATH="/usr/local/go/bin:${PATH}"
          cd build
          # Cap parallelism: the mooncake-store TUs (~3-4GB each with Ascend
          # headers) at -j$(nproc)=4 peak at 12-16GB and get the 16GB runner
          # killed mid-compile. -j2 peaks at ~7GB and builds in ~2x the time.
          cmake --build . -j2
          sudo cmake --install .

      - name: Generate Python version tag
        id: generate_tag_release
        shell: bash
        run: |
          echo "python_version_tag=$(echo ${{ matrix.python-version }} | tr -d '.')" >> $GITHUB_OUTPUT

      - name: Build Python wheel
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
          source /usr/local/Ascend/cann/set_env.sh
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
          NPU_BUILD=1 PYTHON_VERSION=${{ matrix.python-version }} OUTPUT_DIR=dist-npu-py${{ steps.generate_tag_release.outputs.python_version_tag }} ./scripts/build_wheel.sh

      - name: Upload Python wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: mooncake-wheel-npu-${{ matrix.arch }}-py${{ steps.generate_tag_release.outputs.python_version_tag }}
          path: mooncake-wheel/dist-npu-py${{ steps.generate_tag_release.outputs.python_version_tag }}/*.whl

  publish-release:
    needs: build
    runs-on: ubuntu-22.04
    environment: pypi

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: mooncake-wheel/dist-all
          pattern: mooncake-wheel-npu-*

      - name: Prepare wheels for release
        run: |
          mkdir -p mooncake-wheel/dist-release
          find mooncake-wheel/dist-all -name "*.whl" -exec cp {} mooncake-wheel/dist-release/ \;
          echo "Collected wheels for release:"
          ls -la mooncake-wheel/dist-release/

      - name: Upload wheels to NPU GitHub Release
        if: startsWith(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'npu-v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          make_latest: false
          files: mooncake-wheel/dist-release/*.whl

      - name: Upload wheels to GitHub Release
        if: ${{ !startsWith(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'npu-v') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: mooncake-wheel/dist-release/*.whl

      - name: Publish package to PyPI
        if: github.repository == 'kvcache-ai/Mooncake'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mooncake-wheel/dist-release/
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}
