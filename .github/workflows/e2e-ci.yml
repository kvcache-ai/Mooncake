name: E2E CI

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel-xpu:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'run-e2e-ci'
    permissions:
      contents: read
    uses: ./.github/workflows/ci_xpu.yml
    with:
      checkout_ref: ${{ inputs.pr_sha || github.event.pull_request.head.sha || github.sha }}

  xpu-integration-test:
    needs: build-wheel-xpu
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/integration-test-xpu.yml
    with:
      checkout_sha: ${{ inputs.pr_sha || github.event.pull_request.head.sha || github.sha }}
      source_sha: ${{ needs.build-wheel-xpu.outputs.source_sha }}
      artifact_id: ${{ needs.build-wheel-xpu.outputs.artifact_id }}
      artifact_digest: ${{ needs.build-wheel-xpu.outputs.artifact_digest }}
      artifact_attempt: ${{ needs.build-wheel-xpu.outputs.artifact_attempt }}

  ascend-test:
    if: &upstream-main >-
      github.repository == 'kvcache-ai/Mooncake' &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci_ascend.yml
    with:
      checkout_ref: ${{ github.sha }}
    secrets: inherit

  build-wheel-rocm:
    if: *upstream-main
    uses: ./.github/workflows/ci_rocm.yml
    with:
      checkout_ref: ${{ github.sha }}

  integration-test:
    if: *upstream-main
    uses: ./.github/workflows/integration-test.yml
    with:
      pr_sha: ${{ github.sha }}
    secrets: inherit

  rocm-integration-test:
    if: *upstream-main
    needs:
      - build-wheel-rocm
    uses: ./.github/workflows/integration-test-rocm.yml
    with:
      checkout_ref: ${{ github.sha }}
    secrets: inherit

  # Same wheel and test cases as integration-test, but the T-One containers
  # activate the TENT runtime (MC_USE_TENT=1) instead of the classic engine.
  # Runs in parallel so classic regression coverage is preserved while TENT
  # is validated on its way to becoming the default runtime.
  integration-test-tent:
    if: *upstream-main
    uses: ./.github/workflows/integration-test.yml
    with:
      pr_sha: ${{ github.sha }}
      use-tent: true
    secrets: inherit

  e2e-gate:
    name: E2E Gate
    if: >
      always() &&
      github.repository == 'kvcache-ai/Mooncake' &&
      github.ref == 'refs/heads/main'
    needs:
      - ascend-test
      - build-wheel-rocm
      - integration-test
      - rocm-integration-test
      - integration-test-tent
      - build-wheel-xpu
      - xpu-integration-test
    runs-on: ubuntu-latest
    steps:
      - name: Check E2E results
        run: |
          echo "SHA: ${{ github.sha }}"
          failing=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[] |
            select(.value.result != "success") |
            "\(.key): \(.value.result)"')
          if [ -n "$failing" ]; then
            echo "::error::The following E2E jobs failed:"
            echo "$failing"
            exit 1
          fi
          echo "All E2E checks passed."
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
