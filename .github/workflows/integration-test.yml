name: 'Integration test (Linux)'

on:
  workflow_call:
    inputs:
      pr_sha:
        description: 'PR head SHA (passed from parent workflow for workflow_dispatch)'
        required: false
        type: string
      pr_number:
        description: 'PR number (passed from parent workflow for workflow_dispatch)'
        required: false
        type: string
      run_sglang:
        description: 'Run the SGLang integration test through T-one'
        required: false
        default: true
        type: boolean

jobs:
  test-sglang-integration:
    if: inputs.run_sglang
    runs-on: ubuntu-latest
    env:
      tone_user_name: ${{ secrets.TONE_USER_NAME }}
    steps:
      - name: trigger T-one test
        if: ${{ env.tone_user_name != '' }}
        run: |
          # Priority: explicit inputs > PR event context > push SHA
          SHA="${{ inputs.pr_sha || github.event.pull_request.head.sha || github.sha }}"
          PR_ID="${{ inputs.pr_number || github.event.pull_request.number }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            SHA="${{ github.sha }}"
            PR_ID=""
          fi
          echo "PR_ID=${PR_ID}"
          max_attempts=120
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt: Fetching artifact..."
            echo "Target SHA=${SHA}"
            artifact_id=""
            run_id=""
            if curl -L -fs -o runs.json -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&per_page=100"; then
              if jq empty runs.json >/dev/null 2>&1; then
                run_id=$(jq -r '.workflow_runs[] | select((.path == ".github/workflows/ci.yml") or (.name == "Build & Test (Linux)")) | .id' runs.json | head -n 1)
              else
                echo "Failed to download workflow run list. Retrying..."
              fi
              if [ -n "$run_id" ]; then
                echo "Matched workflow run id $run_id"
                if curl -L -fs -o artifact.json -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/actions/runs/${run_id}/artifacts?per_page=100"; then
                  if jq empty artifact.json >/dev/null 2>&1; then
                    artifact_id=$(jq -r '.artifacts[] | select(.name | contains("py312") ) | select(.name | contains("mooncake") ) | select(.name | contains("cu130") ) | .id' artifact.json | head -n 1)
                    if [ -z "$artifact_id" ]; then
                      echo "Available artifacts in workflow run $run_id:"
                      jq -r '.artifacts[].name' artifact.json || true
                    fi
                  else
                    echo "Failed to download artifact list. Retrying..."
                  fi
                else
                  echo "Failed to fetch artifacts for workflow run $run_id. Retrying..."
                fi
              else
                echo "Failed to find Build & Test workflow run for SHA $SHA. Retrying..."
                echo "Available workflow runs for SHA:"
                jq -r '.workflow_runs[] | "\(.id) \(.name) \(.path) \(.status) \(.conclusion)"' runs.json || true
              fi
              if [ -n "$artifact_id" ]; then
                echo "Successfully fetched expected artifact id $artifact_id"
                break
              else
                echo "Failed to fetch expected artifact. Retrying..."
                if [ $attempt -lt $max_attempts ]; then
                  sleep $((attempt * 60 < 600 ? attempt * 60 : 600))
                fi
              fi
            else
              echo "Failed to fetch workflow runs. Retrying..."
              if [ $attempt -lt $max_attempts ]; then
                sleep $((attempt * 60))
              fi
            fi
            attempt=$((attempt + 1))
          done
          if [ $attempt -gt $max_attempts ]; then
            echo "Failed to fetch artifacts after $max_attempts attempts"
            exit 1
          fi

          ENV_INFO="ARTIFACT_ID=${artifact_id} GIT_REPO=${{ github.repository }}"
          if [ -n "$PR_ID" ]; then
            ENV_INFO="${ENV_INFO} PR_ID=${PR_ID}"
          fi
          signature="${{ secrets.TONE_USER_NAME }}|${{ secrets.TONE_USER_TOKEN }}|$(python3 -c "import time;print(time.time())")"
          signature="$(python3 -c "import base64;print(base64.b64encode(\"$signature\".encode('utf-8')).decode('utf-8'))")"
          curl -s -H 'Content-Type: application/json' -X POST -d "{\"workspace\":\"mooncake_test\",\"project\":\"mooncake-ci\",\"template\":\"mooncake-ci-test\",\"name\":\"mooncake-ci-${SHA}\",\"username\":\"${{ secrets.TONE_USER_NAME }}\",\"env_ifs\":\" \",\"env_info\":\"${ENV_INFO}\",\"signature\":\"$signature\"}" https://tone.openanolis.cn/api/job/create/ > job.json
          if [ "$(jq .code job.json)" == 200 ]; then
            echo "job created"
          else
            echo "job create failed"
            exit 1
          fi
          job_id=$(jq .data.id job.json)
          echo "check job status here and remember to cancel it before restart the job !"
          echo "job_url: https://tone.openanolis.cn/ws/gclfnh19/test_result/${job_id}?tab=4"
          echo "job_id=${job_id}" >> $GITHUB_ENV
        shell: bash

      - name: qurey job results
        if: ${{ env.tone_user_name != '' }}
        run: |
          total_time=0
          max_total_time=2880
          time=0
          max_time=240

          while true; do
            if [ $total_time -gt $max_total_time ]; then
              echo "Total timeout reached (24 hours)"
              exit 1
            fi

            if [ $time -gt $max_time ]; then
              echo "Current running job timeout reached (720 attempts)"
              exit 1
            fi

            signature="${{ secrets.TONE_USER_NAME }}|${{ secrets.TONE_USER_TOKEN }}|$(python3 -c "import time;print(time.time())")"
            signature="$(python3 -c "import base64;print(base64.b64encode(\"$signature\".encode('utf-8')).decode('utf-8'))")"
            curl -s -H 'Content-Type: application/json' -X POST -d "{\"username\":\"${{ secrets.TONE_USER_NAME }}\", \"signature\":\"$signature\", \"job_id\": \"${job_id}\"}" https://tone.openanolis.cn/api/job/query/ > job_status.json
            if ! [ "$(jq .code job_status.json)" == 200 ]; then
              echo "job query failed"
              exit 1
            fi
            job_state=$(jq .data.job_state job_status.json)
            job_status=$(jq .data.job_second_state job_status.json)

            if [[ $job_status =~ "pass" ]]; then
              echo "job successful !"
              exit 0
            elif [[ $job_status =~ "fail" ]] ; then
              echo "job failed or stopped !"
              exit 1
            fi

            if [[ $job_state =~ "running" ]]; then
              time=$(( time + 1))
            fi

            total_time=$(( total_time + 1 ))
            sleep 30
          done
        shell: bash

  test-rocm-integration:
    name: ROCm MI350X external PD
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'run-e2e-ci')
    runs-on: [self-hosted, Linux, X64, amd, rocm, gfx950, mooncake-pd]
    timeout-minutes: 390
    concurrency:
      group: mooncake-rocm-mi350x
      cancel-in-progress: false
    steps:
      # Pytest previously ran as root in a bind-mounted container and left
      # caches that the non-root runner could not remove on the next checkout.
      # Use the pinned ROCm test image to repair only those generated paths
      # before actions/checkout invokes git clean.
      - name: Remove root-owned Python test caches
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network=none \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            --entrypoint /bin/rm \
            "lmsysorg/sglang:v0.5.18-rocm720-mi35x@sha256:6d68cd19206716cb3f1e31e2ad89cd0852d7ae614a792773c30a4277f8955c72" \
            -rf \
            /workspace/scripts/tone_tests/python/.pytest_cache \
            /workspace/scripts/tone_tests/python/__pycache__

      # pull_request_target keeps this workflow definition on the trusted base
      # branch. A maintainer must apply run-e2e-ci before PR code can reach the
      # persistent GPU hosts.
      - name: Check out tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Download Python 3.10 ROCm wheel
        uses: actions/download-artifact@v4
        with:
          name: mooncake-wheel-rocm-ubuntu-py310
          path: ${{ runner.temp }}/mooncake-wheel-rocm-py310

      - name: Download Python 3.12 ROCm wheel
        uses: actions/download-artifact@v4
        with:
          name: mooncake-wheel-rocm-ubuntu-py312
          path: ${{ runner.temp }}/mooncake-wheel-rocm-py312

      - name: Run two-node ROCm external PD suite
        shell: bash
        env:
          WHEEL_DIR_SGLANG: ${{ runner.temp }}/mooncake-wheel-rocm-py310
          WHEEL_DIR_VLLM: ${{ runner.temp }}/mooncake-wheel-rocm-py312
        run: |
          set -euo pipefail
          [ "$(id -u)" -ne 0 ] || {
            echo "The self-hosted runner must not run as root" >&2
            exit 1
          }
          [ -r /etc/mooncake-ci/runner.env ] || {
            echo "Missing controller profile: /etc/mooncake-ci/runner.env" >&2
            exit 1
          }
          set -a
          # shellcheck disable=SC1091
          source /etc/mooncake-ci/runner.env
          set +a
          export WHEEL_DIR_SGLANG WHEEL_DIR_VLLM

          required_vars=(
            CI_ACCELERATOR LOCAL_IP REMOTE_IP REMOTE_SSH_TARGET
            MODEL_CACHE MOONCAKE_CI_TIER MOONCAKE_GPU_INDICES
            MOONCAKE_RENDER_DEVICES MOONCAKE_CPUSET_CPUS
            MOONCAKE_CPUSET_MEMS MOONCAKE_SSH_CONFIG
            MOONCAKE_LOCK_FILE REMOTE_TEST_DIR MOONCAKE_RDMA_DEVICES
            MOONCAKE_RDMA_NETDEVS MOONCAKE_GID_INDEX
          )
          for variable in "${required_vars[@]}"; do
            [ -n "${!variable:-}" ] || {
              echo "Missing controller setting: $variable" >&2
              exit 1
            }
          done
          [ "$CI_ACCELERATOR" = rocm ]
          export SSH_CMD="ssh -F ${MOONCAKE_SSH_CONFIG}"

          for command in docker flock rocm-smi rsync ssh; do
            command -v "$command" >/dev/null || {
              echo "Missing required command: $command" >&2
              exit 1
            }
          done
          test -c /dev/kfd
          ssh -F "${MOONCAKE_SSH_CONFIG}" "${REMOTE_SSH_TARGET}" true
          [ -w "$(dirname "$MOONCAKE_LOCK_FILE")" ] || {
            echo "Runner cannot write the Mooncake lock directory" >&2
            exit 1
          }

          exec 9>"${MOONCAKE_LOCK_FILE}"
          flock -n 9 || {
            echo "The MI350X Mooncake allocation is already in use" >&2
            exit 1
          }

          cleanup() {
            if [ -f scripts/tone_tests/run/.shrc ]; then
              set +e
              # shellcheck disable=SC1091
              source scripts/tone_tests/run/.shrc
              # shellcheck disable=SC1091
              source scripts/tone_tests/scripts/common.sh
              cleanup_test_env double
            fi
          }
          trap cleanup EXIT INT TERM
          bash scripts/tone_tests/scripts/run_test.sh run-all

      - name: Upload ROCm external PD logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocm-external-pd-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: scripts/tone_tests/run/logs
          if-no-files-found: warn
          retention-days: 14
