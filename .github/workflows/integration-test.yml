name: 'Integration test (Linux)'

on:
  workflow_call:
    inputs:
      pr_sha:
        description: 'PR head SHA (passed from parent workflow for workflow_dispatch)'
        required: false
        type: string
      pr_number:
        description: 'PR number (passed from parent workflow for workflow_dispatch)'
        required: false
        type: string

jobs:
  test-sglang-integration:
    runs-on: ubuntu-latest
    env:
      tone_user_name: ${{ secrets.TONE_USER_NAME }}
    steps:
      - name: trigger T-one test
        if: ${{ env.tone_user_name != '' }}
        run: |
          # Priority: explicit inputs > PR event context > push SHA
          SHA="${{ inputs.pr_sha || github.event.pull_request.head.sha || github.sha }}"
          PR_ID="${{ inputs.pr_number || github.event.pull_request.number }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            SHA="${{ github.sha }}"
            PR_ID=""
          fi
          echo "PR_ID=${PR_ID}"
          max_attempts=120
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt: Fetching artifact..."
            echo "Target SHA=${SHA}"
            artifact_id=""
            run_id=""
            if curl -L -fs -o runs.json -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&per_page=100"; then
              if jq empty runs.json >/dev/null 2>&1; then
                run_id=$(jq -r '.workflow_runs[] | select((.path == ".github/workflows/ci.yml") or (.name == "Build & Test (Linux)")) | .id' runs.json | head -n 1)
              else
                echo "Failed to download workflow run list. Retrying..."
              fi
              if [ -n "$run_id" ]; then
                echo "Matched workflow run id $run_id"
                if curl -L -fs -o artifact.json -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/actions/runs/${run_id}/artifacts?per_page=100"; then
                  if jq empty artifact.json >/dev/null 2>&1; then
                    artifact_id=$(jq -r '.artifacts[] | select(.name | contains("py312") ) | select(.name | contains("mooncake") ) | select(.name | contains("cu130") ) | .id' artifact.json | head -n 1)
                    if [ -z "$artifact_id" ]; then
                      echo "Available artifacts in workflow run $run_id:"
                      jq -r '.artifacts[].name' artifact.json || true
                    fi
                  else
                    echo "Failed to download artifact list. Retrying..."
                  fi
                else
                  echo "Failed to fetch artifacts for workflow run $run_id. Retrying..."
                fi
              else
                echo "Failed to find Build & Test workflow run for SHA $SHA. Retrying..."
                echo "Available workflow runs for SHA:"
                jq -r '.workflow_runs[] | "\(.id) \(.name) \(.path) \(.status) \(.conclusion)"' runs.json || true
              fi
              if [ -n "$artifact_id" ]; then
                echo "Successfully fetched expected artifact id $artifact_id"
                break
              else
                echo "Failed to fetch expected artifact. Retrying..."
                if [ $attempt -lt $max_attempts ]; then
                  sleep $((attempt * 60 < 600 ? attempt * 60 : 600))
                fi
              fi
            else
              echo "Failed to fetch workflow runs. Retrying..."
              if [ $attempt -lt $max_attempts ]; then
                sleep $((attempt * 60))
              fi
            fi
            attempt=$((attempt + 1))
          done
          if [ $attempt -gt $max_attempts ]; then
            echo "Failed to fetch artifacts after $max_attempts attempts"
            exit 1
          fi

          ENV_INFO="ARTIFACT_ID=${artifact_id} GIT_REPO=${{ github.repository }}"
          if [ -n "$PR_ID" ]; then
            ENV_INFO="${ENV_INFO} PR_ID=${PR_ID}"
          fi
          signature="${{ secrets.TONE_USER_NAME }}|${{ secrets.TONE_USER_TOKEN }}|$(python3 -c "import time;print(time.time())")"
          signature="$(python3 -c "import base64;print(base64.b64encode(\"$signature\".encode('utf-8')).decode('utf-8'))")"
          curl -s -H 'Content-Type: application/json' -X POST -d "{\"workspace\":\"mooncake_test\",\"project\":\"mooncake-ci\",\"template\":\"mooncake-ci-test\",\"name\":\"mooncake-ci-${SHA}\",\"username\":\"${{ secrets.TONE_USER_NAME }}\",\"env_ifs\":\" \",\"env_info\":\"${ENV_INFO}\",\"signature\":\"$signature\"}" https://tone.openanolis.cn/api/job/create/ > job.json
          if [ "$(jq .code job.json)" == 200 ]; then
            echo "job created"
          else
            echo "job create failed"
            exit 1
          fi
          job_id=$(jq .data.id job.json)
          echo "check job status here and remember to cancel it before restart the job !"
          echo "job_url: https://tone.openanolis.cn/ws/gclfnh19/test_result/${job_id}?tab=4"
          echo "job_id=${job_id}" >> $GITHUB_ENV
        shell: bash

      - name: qurey job results
        if: ${{ env.tone_user_name != '' }}
        run: |
          total_time=0
          max_total_time=2880
          time=0
          max_time=240

          while true; do
            if [ $total_time -gt $max_total_time ]; then
              echo "Total timeout reached (24 hours)"
              exit 1
            fi

            if [ $time -gt $max_time ]; then
              echo "Current running job timeout reached (720 attempts)"
              exit 1
            fi

            signature="${{ secrets.TONE_USER_NAME }}|${{ secrets.TONE_USER_TOKEN }}|$(python3 -c "import time;print(time.time())")"
            signature="$(python3 -c "import base64;print(base64.b64encode(\"$signature\".encode('utf-8')).decode('utf-8'))")"
            curl -s -H 'Content-Type: application/json' -X POST -d "{\"username\":\"${{ secrets.TONE_USER_NAME }}\", \"signature\":\"$signature\", \"job_id\": \"${job_id}\"}" https://tone.openanolis.cn/api/job/query/ > job_status.json
            if ! [ "$(jq .code job_status.json)" == 200 ]; then
              echo "job query failed"
              exit 1
            fi
            job_state=$(jq .data.job_state job_status.json)
            job_status=$(jq .data.job_second_state job_status.json)

            if [[ $job_status =~ "pass" ]]; then
              echo "job successful !"
              exit 0
            elif [[ $job_status =~ "fail" ]] ; then
              echo "job failed or stopped !"
              exit 1
            fi

            if [[ $job_state =~ "running" ]]; then
              time=$(( time + 1))
            fi

            total_time=$(( total_time + 1 ))
            sleep 30
          done
        shell: bash

  test-rocm-integration:
    name: ROCm MI350X external PD (4+4 core tier)
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'opened' ||
      contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 390
    env:
      TONE_USER_NAME: ${{ secrets.TONE_ROCM_USER_NAME }}
      TONE_USER_TOKEN: ${{ secrets.TONE_ROCM_USER_TOKEN }}
      TONE_TEMPLATE: ${{ secrets.TONE_ROCM_TEMPLATE }}
      GH_API_TOKEN: ${{ github.token }}
    steps:
      - name: Report unconfigured ROCm external CI
        if: ${{ env.TONE_USER_NAME == '' || env.TONE_USER_TOKEN == '' || env.TONE_TEMPLATE == '' }}
        run: echo "ROCm external CI is staged but its T-One credentials/template are not configured."

      - name: Resolve ROCm wheel artifacts and trigger T-One
        if: ${{ env.TONE_USER_NAME != '' && env.TONE_USER_TOKEN != '' && env.TONE_TEMPLATE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ inputs.pr_sha || github.event.pull_request.head.sha || github.sha }}"
          PR_ID="${{ inputs.pr_number || github.event.pull_request.number }}"
          if [ "${{ github.event_name }}" = push ]; then
            SHA="${{ github.sha }}"
            PR_ID=""
          fi

          for attempt in $(seq 1 120); do
            run_id=""
            if curl -LfsS \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Authorization: Bearer ${GH_API_TOKEN}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&per_page=100" \
              -o runs.json; then
              run_id=$(jq -r '.workflow_runs[] | select(.path == ".github/workflows/ci.yml") | .id' runs.json | head -n1 || true)
            fi
            if [ -n "$run_id" ]; then
              if curl -LfsS \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Authorization: Bearer ${GH_API_TOKEN}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/${run_id}/artifacts?per_page=100" \
                -o artifacts.json; then
                artifact_py310=$(jq -r '.artifacts[] | select(.name == "mooncake-wheel-rocm-ubuntu-py310" and (.expired | not)) | .id' artifacts.json | head -n1 || true)
                artifact_py312=$(jq -r '.artifacts[] | select(.name == "mooncake-wheel-rocm-ubuntu-py312" and (.expired | not)) | .id' artifacts.json | head -n1 || true)
                if [ -n "$artifact_py310" ] && [ -n "$artifact_py312" ]; then
                  break
                fi
              fi
            fi
            [ "$attempt" -lt 120 ] || { echo "ROCm wheel artifacts did not appear" >&2; exit 1; }
            sleep 30
          done

          ENV_INFO="ARTIFACT_ID_SGLANG=${artifact_py310} ARTIFACT_ID_VLLM=${artifact_py312} GIT_REPO=${{ github.repository }} CI_ACCELERATOR=rocm MOONCAKE_CI_TIER=core-4gpu"
          [ -z "$PR_ID" ] || ENV_INFO="${ENV_INFO} PR_ID=${PR_ID}"
          signature="${TONE_USER_NAME}|${TONE_USER_TOKEN}|$(python3 -c 'import time; print(time.time())')"
          signature=$(printf '%s' "$signature" | base64 -w0)
          jq -n \
            --arg workspace mooncake_test \
            --arg project mooncake-ci \
            --arg template "$TONE_TEMPLATE" \
            --arg name "mooncake-rocm-ci-${SHA}" \
            --arg username "$TONE_USER_NAME" \
            --arg env_info "$ENV_INFO" \
            --arg signature "$signature" \
            '{workspace:$workspace,project:$project,template:$template,name:$name,username:$username,env_ifs:" ",env_info:$env_info,signature:$signature}' \
            > request.json
          curl -fsS -H 'Content-Type: application/json' -X POST \
            --data @request.json https://tone.openanolis.cn/api/job/create/ -o job.json
          [ "$(jq -r .code job.json)" = 200 ] || { jq . job.json; exit 1; }
          job_id=$(jq -r .data.id job.json)
          [ -n "$job_id" ] && [ "$job_id" != null ] || { echo "T-One returned no job ID" >&2; exit 1; }
          echo "job_id=$job_id" >> "$GITHUB_ENV"
          echo "T-One ROCm job: $job_id"

      - name: Query ROCm T-One result
        if: ${{ env.TONE_USER_NAME != '' && env.TONE_USER_TOKEN != '' && env.TONE_TEMPLATE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 720); do
            signature="${TONE_USER_NAME}|${TONE_USER_TOKEN}|$(python3 -c 'import time; print(time.time())')"
            signature=$(printf '%s' "$signature" | base64 -w0)
            jq -n --arg username "$TONE_USER_NAME" --arg signature "$signature" \
              --arg job_id "$job_id" '{username:$username,signature:$signature,job_id:$job_id}' > query.json
            curl -fsS -H 'Content-Type: application/json' -X POST \
              --data @query.json https://tone.openanolis.cn/api/job/query/ -o status.json
            [ "$(jq -r .code status.json)" = 200 ] || { jq . status.json; exit 1; }
            state=$(jq -r .data.job_second_state status.json)
            case "$state" in
              *pass*) exit 0 ;;
              *fail*|*stop*) jq .data status.json; exit 1 ;;
            esac
            sleep 30
          done
          echo "ROCm T-One job exceeded its six-hour controller timeout" >&2
          exit 1
