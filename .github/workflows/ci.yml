name: 'Build & Test (Linux)'

on:
  push:
    branches:
      - "main"
      - "release/**"
  pull_request:
    branches:
      - "main"
      - "release/**"
    # `labeled` is intentionally omitted. Auto-labeler already applies
    # `run-ci`, so any new label (including `run-e2e-ci`) would retrigger
    # this whole workflow and cancel the in-progress run. Same-SHA
    # retrigger via the `run-ci` label lives in ci-on-label.yml.
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Build the artifact tested below through the exact release wheel path. The
  # Ubuntu jobs remain consumer tests, not an alternate wheel build environment.
  build-wheel:
    needs: [spell-check, clang-format, check-paths]
    if: &run-ci-for-source-changes >-
      (needs.check-paths.outputs.should-run-downstream == 'true' ||
       github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' ||
         contains(github.event.pull_request.labels.*.name, 'run-ci'))))
    uses: ./.github/workflows/_build-wheel.yaml
    with:
      python-versions: '["3.10", "3.12"]'
      artifact-prefix: mooncake-wheel-ci
      version-override: 0.0.0.dev0

  test-wheel-ubuntu:
    needs: [build-wheel]
    if: >-
      needs.build-wheel.result == 'success' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' ||
         contains(github.event.pull_request.labels.*.name, 'run-ci'))))
    strategy:
      matrix:
        include:
          - ubuntu-version: ubuntu-22.04
            python-version: '3.12'
          - ubuntu-version: ubuntu-24.04
            python-version: '3.10'
    runs-on: ${{ matrix.ubuntu-version }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Generate Python version tag
      id: generate_tag_test
      run: |
        echo "python_version_tag=$(echo ${{ matrix.python-version }} | tr -d '.')" >> $GITHUB_OUTPUT
      shell: bash

    - name: Download wheel artifact
      uses: actions/download-artifact@v4
      with:
        name: mooncake-wheel-ci-py${{ steps.generate_tag_test.outputs.python_version_tag }}
        path: mooncake-wheel/dist

    - name: Verify wheel file exists
      run: |
        ls -la mooncake-wheel/dist/
        if [ ! -f mooncake-wheel/dist/*.whl ]; then
          echo "ERROR: No wheel file found in mooncake-wheel/dist/"
          exit 1
        fi
      shell: bash

    - name: Free up disk space
      uses: ./.github/actions/free-disk-space

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.24
      with:
        cuda: '12.8.1'
        linux-local-args: '["--toolkit"]'
        method: 'network'

    - name: Run installation test script
      run: |
        bash scripts/test_installation.sh
      shell: bash

    - name: Run all PG CPU tests with latest PyTorch
      if: matrix.ubuntu-version == 'ubuntu-22.04' && matrix.python-version == '3.12'
      env:
        MC_FORCE_TCP: "true"
      run: |
        source test_env/bin/activate
        export LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}:/usr/local/lib
        python -m unittest discover -s mooncake-pg/tests -k CPU -v
      shell: bash

    - name: Run Store API and RPC smoke tests
      if: matrix.ubuntu-version == 'ubuntu-22.04' && matrix.python-version == '3.12'
      env:
        MOONCAKE_MASTER: "127.0.0.1:50051"
        MOONCAKE_TE_META_DATA_SERVER: "http://127.0.0.1:8080/metadata"
        MOONCAKE_PROTOCOL: "tcp"
        LOCAL_HOSTNAME: "127.0.0.1"
      run: |
        source test_env/bin/activate
        export LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}:/usr/local/lib
        python -m pip install safetensors

        reserved_ports=$(sysctl -n net.ipv4.ip_local_reserved_ports)
        sudo sysctl -w \
          "net.ipv4.ip_local_reserved_ports=${reserved_ports:+$reserved_ports,}50052"

        mkdir -p /tmp/mooncake_storage
        mooncake_master \
          --default_kv_lease_ttl=500 \
          --eviction_high_watermark_ratio=0.95 \
          --cluster_id=ci_store_api_smoke \
          --port 50051 \
          --enable_http_metadata_server=true \
          >"$RUNNER_TEMP/mooncake-master.log" 2>&1 &
        master_pid=$!
        rpc_server_pid=""

        cleanup() {
          if [ -n "$rpc_server_pid" ]; then
            kill "$rpc_server_pid" 2>/dev/null || true
            wait "$rpc_server_pid" 2>/dev/null || true
          fi
          kill "$master_pid" 2>/dev/null || true
          wait "$master_pid" 2>/dev/null || true
        }
        trap cleanup EXIT

        master_ready=false
        for _ in {1..50}; do
          if ! kill -0 "$master_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/mooncake-master.log"
            echo "::error::mooncake_master exited before becoming ready"
            exit 1
          fi
          if ss -H -ltn 'sport = :50051' | grep -q . && \
             ss -H -ltn 'sport = :8080' | grep -q .; then
            master_ready=true
            break
          fi
          sleep 0.1
        done
        if [ "$master_ready" != true ]; then
          cat "$RUNNER_TEMP/mooncake-master.log"
          echo "::error::mooncake_master did not become ready within 5 seconds"
          exit 1
        fi

        python scripts/test_upsert_api.py
        python -m unittest mooncake-wheel.tests.test_weight_snapshot_api
        python scripts/test_async_store.py
        python scripts/test_copy_move_api.py
        python -m unittest mooncake-wheel.tests.test_safetensor_functions
        python scripts/test_drain_http_api.py --timeout-sec 90

        python -u mooncake-transfer-engine/tests/rpc_communicator_test.py \
          server --url 127.0.0.1:9004 --data-size 1 \
          >"$RUNNER_TEMP/rpc-server.log" 2>&1 &
        rpc_server_pid=$!
        rpc_ready=false
        for _ in {1..50}; do
          if ! kill -0 "$rpc_server_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/rpc-server.log"
            echo "::error::RPC communicator server exited before becoming ready"
            exit 1
          fi
          if ss -H -ltn 'sport = :9004' | grep -q .; then
            rpc_ready=true
            break
          fi
          sleep 0.1
        done
        if [ "$rpc_ready" != true ]; then
          cat "$RUNNER_TEMP/rpc-server.log"
          echo "::error::RPC communicator server did not become ready within 5 seconds"
          exit 1
        fi

        client_rc=0
        timeout 10 python -u \
          mooncake-transfer-engine/tests/rpc_communicator_test.py \
          client --url 127.0.0.1:9004 --threads 2 --data-size 1 \
          >"$RUNNER_TEMP/rpc-client.log" 2>&1 || \
          client_rc=$?
        cat "$RUNNER_TEMP/rpc-client.log"
        if [ "$client_rc" -ne 0 ] && [ "$client_rc" -ne 124 ]; then
          echo "::error::RPC communicator client failed with exit code $client_rc"
          exit "$client_rc"
        fi
        if ! grep -q '^bandwidth:' "$RUNNER_TEMP/rpc-client.log"; then
          cat "$RUNNER_TEMP/rpc-server.log"
          echo "::error::RPC communicator did not complete a successful transfer"
          exit 1
        fi
      shell: bash

    - name: Run SSD offload and promotion end-to-end tests
      if: matrix.ubuntu-version == 'ubuntu-22.04' && matrix.python-version == '3.12'
      run: |
        source test_env/bin/activate
        export LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}:/usr/local/lib

        metadata_pid=""
        master_pid=""
        cleanup() {
          status=$?
          trap - EXIT
          if [ -n "$master_pid" ]; then
            kill "$master_pid" 2>/dev/null || true
            wait "$master_pid" 2>/dev/null || true
          fi
          if [ -n "$metadata_pid" ]; then
            kill "$metadata_pid" 2>/dev/null || true
            wait "$metadata_pid" 2>/dev/null || true
          fi
          if [ "$status" -ne 0 ]; then
            cat "$RUNNER_TEMP/mooncake-ssd-master.log" 2>/dev/null || true
            cat "$RUNNER_TEMP/mooncake-promotion-master.log" 2>/dev/null || true
            cat "$RUNNER_TEMP/mooncake-metadata.log" 2>/dev/null || true
          fi
          rm -rf /tmp/mooncake_ci_ssd_offload \
            /tmp/mooncake_ci_promotion
          exit "$status"
        }
        trap cleanup EXIT

        wait_for_port() {
          local pid=$1
          local port=$2
          local label=$3
          for _ in {1..50}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::$label exited before listening on port $port"
              return 1
            fi
            if ss -H -ltn "sport = :$port" | grep -q .; then
              return 0
            fi
            sleep 0.1
          done
          echo "::error::$label did not listen on port $port within 5 seconds"
          return 1
        }

        stop_master() {
          kill "$master_pid" 2>/dev/null || true
          wait "$master_pid" 2>/dev/null || true
          master_pid=""
        }

        mooncake_http_metadata_server --port 8080 \
          >"$RUNNER_TEMP/mooncake-metadata.log" 2>&1 &
        metadata_pid=$!
        wait_for_port "$metadata_pid" 8080 "metadata server"

        mkdir -p /tmp/mooncake_ci_ssd_offload
        mooncake_master \
          --default_kv_lease_ttl=500 \
          --root_fs_dir=/tmp/mooncake_ci_ssd_offload \
          >"$RUNNER_TEMP/mooncake-ssd-master.log" 2>&1 &
        master_pid=$!
        wait_for_port "$master_pid" 50051 "SSD offload master"
        MC_METADATA_SERVER=http://127.0.0.1:8080/metadata \
          DEFAULT_KV_LEASE_TTL=500 \
          python mooncake-wheel/tests/test_ssd_offload_in_evict.py
        stop_master

        mkdir -p /tmp/mooncake_ci_promotion
        mooncake_master \
          --default_kv_lease_ttl=500 \
          --root_fs_dir=/tmp/mooncake_ci_promotion \
          --enable_offload=true \
          --offload_on_evict=true \
          --promotion_on_hit=true \
          --promotion_admission_threshold=1 \
          --promotion_max_per_heartbeat=16 \
          >"$RUNNER_TEMP/mooncake-promotion-master.log" 2>&1 &
        master_pid=$!
        wait_for_port "$master_pid" 50051 "promotion master"
        MC_METADATA_SERVER=http://127.0.0.1:8080/metadata \
          DEFAULT_KV_LEASE_TTL=500 \
          MOONCAKE_OFFLOAD_FILE_STORAGE_PATH=/tmp/mooncake_ci_promotion \
          MOONCAKE_OFFLOAD_HEARTBEAT_INTERVAL_SECONDS=2 \
          MOONCAKE_OFFLOAD_BUCKET_KEYS_LIMIT=10 \
          MOONCAKE_OFFLOAD_BUCKET_SIZE_LIMIT_BYTES=10485760 \
          python mooncake-wheel/tests/test_promotion_on_hit.py
        stop_master
      shell: bash

  unit-tests:
    name: CTest unit tests (Python 3.12)
    needs: [check-paths]
    if: *run-ci-for-source-changes
    runs-on: ubuntu-22.04
    env:
      CI: "true"
      SCCACHE_GHA_ENABLED: "true"
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install and start etcd
      run: |
        wget -q https://github.com/etcd-io/etcd/releases/download/v3.6.1/etcd-v3.6.1-linux-amd64.tar.gz
        tar xzf etcd-v3.6.1-linux-amd64.tar.gz
        sudo mv etcd-v3.6.1-linux-amd64/etcd* /usr/local/bin/
        etcd --advertise-client-urls http://127.0.0.1:2379 --listen-client-urls http://127.0.0.1:2379 &
        sleep 3
        ETCDCTL_API=3 etcdctl --endpoints=http://127.0.0.1:2379 endpoint health
      shell: bash

    - name: Free up disk space
      uses: ./.github/actions/free-disk-space

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.24
      with:
        cuda: '12.8.1'
        linux-local-args: '["--toolkit"]'
        method: 'network'
        sub-packages: '["nvcc"]'

    - name: Install build utilities and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build
        sudo bash -x dependencies.sh -y
        echo "/usr/local/go/bin" >> "$GITHUB_PATH"
      shell: bash

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Configure sccache
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Configure project with unit tests
      run: |
        cmake -S . -B build -G Ninja \
          -DUSE_HTTP=ON \
          -DUSE_CXL=ON \
          -DUSE_UB=ON \
          -DUSE_ETCD=ON \
          -DUSE_CUDA=ON \
          -DWITH_P2P_STORE=ON \
          -DWITH_CONDUCTOR=ON \
          -DSTORE_USE_ETCD=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_UNIT_TESTS=ON \
          -DENABLE_SCCACHE=ON
      shell: bash

    - name: Configure CUDA driver runtime
      run: |
        cuda_driver_library=$(sed -n \
          's/^CUDA_cuda_driver_LIBRARY:FILEPATH=//p' build/CMakeCache.txt)
        if [ -z "$cuda_driver_library" ] || [ ! -f "$cuda_driver_library" ]; then
          echo "::error::CMake did not resolve the CUDA driver library"
          exit 1
        fi

        cuda_driver_dir=$(dirname "$cuda_driver_library")
        if [ ! -e "$cuda_driver_dir/libcuda.so.1" ]; then
          sudo ln -s "$(basename "$cuda_driver_library")" \
            "$cuda_driver_dir/libcuda.so.1"
        fi
        echo "LIBRARY_PATH=$cuda_driver_dir:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$cuda_driver_dir:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      shell: bash

    - name: Build project and unit tests
      run: |
        cmake --build build --parallel 128
        sudo -E cmake --install build
      shell: bash

    - name: Run Mooncake Store Rust unit tests
      env:
        MOONCAKE_BUILD_DIR: ${{ github.workspace }}/build
        MOONCAKE_STORE_LIB_DIR: ${{ github.workspace }}/build/mooncake-store/src
        MOONCAKE_STORE_INCLUDE_DIR: ${{ github.workspace }}/mooncake-store/include
      run: |
        export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/build/mooncake-asio:$GITHUB_WORKSPACE/build/mooncake-store/src:$GITHUB_WORKSPACE/build/mooncake-store/src/cachelib_memory_allocator:$GITHUB_WORKSPACE/build/mooncake-transfer-engine/src:$GITHUB_WORKSPACE/build/mooncake-transfer-engine/src/common/base:$GITHUB_WORKSPACE/build/mooncake-common/etcd:/usr/local/lib:${LD_LIBRARY_PATH:-}"
        cargo test --manifest-path mooncake-store/rust/Cargo.toml --lib
      shell: bash

    - name: Start Metadata Server
      run: |
        cd mooncake-transfer-engine/example/http-metadata-server-python
        pip install aiohttp
        python ./bootstrap_server.py &
        sleep 2
      shell: bash

    - name: Run all CTest unit tests
      id: ctest
      run: |
        reserved_ports=$(sysctl -n net.ipv4.ip_local_reserved_ports)
        sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${reserved_ports:+$reserved_ports,}50052"
        mkdir -p build/test-results
        export LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}:/usr/local/lib
        MC_METADATA_SERVER=http://127.0.0.1:8080/metadata \
        DEFAULT_KV_LEASE_TTL=500 \
          ctest --test-dir build --parallel "$(nproc)" --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build/test-results/ctest.xml"
      shell: bash

    - name: Preserve CTest diagnostics
      if: ${{ always() && steps.ctest.outcome == 'failure' }}
      uses: ./.github/actions/ctest-diagnostics
      with:
        summary-title: PR CTest failure
        artifact-name: ctest-diagnostics-pr
        junit-report: build/test-results/ctest.xml
        failed-tests-log: build/Testing/Temporary/LastTestsFailed.log
        last-test-log: build/Testing/Temporary/LastTest.log

  build-flags:
    needs: [check-paths]
    if: *run-ci-for-source-changes
    runs-on: ubuntu-22.04
    env:
      CI: "true"
      SCCACHE_GHA_ENABLED: "true"
      PIP_NO_CACHE_DIR: "1"
      CMAKE_RELWITHDEBINFO_FLAGS: "-O2 -DNDEBUG"

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Free up disk space
      uses: ./.github/actions/free-disk-space

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.24
      with:
        cuda: '12.8.1'
        linux-local-args: '["--toolkit"]'
        method: 'network'
        sub-packages: '["nvcc", "nvrtc-dev"]'
        non-cuda-sub-packages: '["libcusparse-dev", "libcublas-dev", "libcusolver-dev"]'

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Configure sccache
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt install -y ninja-build
        sudo bash -x dependencies.sh -y
        df -h
      shell: bash

    - name: Build transfer engine only
      run: |
        cd mooncake-transfer-engine
        mkdir build
        cd build
        export PATH=/usr/local/nvidia/bin:/usr/local/nvidia/lib64:$PATH
        export LD_LIBRARY_PATH=/usr/local/cuda/lib64/stubs:$LD_LIBRARY_PATH
        cmake -G Ninja .. \
          -DUSE_ETCD=OFF \
          -DUSE_CXL=ON \
          -DUSE_REDIS=ON \
          -DUSE_HTTP=ON \
          -DWITH_METRICS=ON \
          -DBUILD_UNIT_TESTS=ON \
          -DBUILD_EXAMPLES=ON \
          -DENABLE_SCCACHE=ON \
          -DUSE_CUDA=OFF \
          -DUSE_MNNVL=OFF \
          -DUSE_UB=OFF \
          -DCMAKE_EXE_LINKER_FLAGS="-L/usr/local/cuda/lib64/stubs" \
          "-DCMAKE_C_FLAGS_RELWITHDEBINFO=${CMAKE_RELWITHDEBINFO_FLAGS}" \
          "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=${CMAKE_RELWITHDEBINFO_FLAGS}" \
          -DENABLE_DEBUG_SYMBOLS=OFF
        cmake --build .
        sudo cmake --install .
        df -h
        cd ..
        rm -rf build
        df -h
      shell: bash

  spell-check:
    name: Spell Check with Typos
    if: &run-ci >-
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' ||
         contains(github.event.pull_request.labels.*.name, 'run-ci'))))
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Spell Check Repo
      uses: crate-ci/typos@v1.30.2

  reshard-type-check:
    name: Check reshard manifest types
    if: *run-ci
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Check canonical reshard contract types
      run: |
        python -m pip install --disable-pip-version-check pyright==1.1.411
        bash scripts/check_reshard_types.sh
      shell: bash

  release-gate-tests:
    name: Test TestPyPI release gate
    if: *run-ci
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run focused release gate tests
      run: |
        python -m pip install --disable-pip-version-check \
          packaging pytest==8.3.5
        python -m pytest -q mooncake-wheel/tests/test_testpypi_wheel_gate.py
      shell: bash

  clang-format:
    name: Check code format
    if: *run-ci
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for branch comparison
        persist-credentials: false

    - name: Install clang-format 20
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 20
        sudo apt-get install -y clang-format-20

    - name: Check code format
      run: |
        # Check script exists and is executable
        if [[ ! -x ./scripts/code_format.sh ]]; then
          echo "Error: code_format.sh not found or not executable"
          exit 1
        fi

        # Determine base ref for comparison
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          # For PRs: compare against the target branch
          BASE_REF="origin/${{ github.base_ref }}"
        else
          # For push events: use github.event.before to handle multi-commit pushes
          BEFORE_SHA="${{ github.event.before }}"
          if [ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]; then
            # New branch push, compare against default branch
            BASE_REF="origin/${{ github.event.repository.default_branch }}"
          else
            # Normal push (single or multiple commits)
            BASE_REF="${BEFORE_SHA}"
          fi
        fi
        echo "Comparing against: ${BASE_REF}"
        ./scripts/code_format.sh --check --changed-lines --base "${BASE_REF}"
      shell: bash

  python-lint:
    name: Check Python with Ruff
    if: *run-ci
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Ruff
      run: python -m pip install --disable-pip-version-check ruff==0.6.9

    - name: Check changed Python files
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base_ref="origin/${{ github.base_ref }}"
        elif [ "${{ github.event.before }}" = \
               "0000000000000000000000000000000000000000" ]; then
          base_ref="origin/${{ github.event.repository.default_branch }}"
        elif [ -n "${{ github.event.before }}" ]; then
          base_ref="${{ github.event.before }}"
        else
          base_ref="HEAD^"
        fi

        mapfile -d '' python_files < <(
          git diff --name-only --diff-filter=ACMR -z "$base_ref"...HEAD -- \
            '*.py' \
            ':(exclude)extern/**' \
            ':(exclude)FAST25-release/**'
        )
        if [ "${#python_files[@]}" -eq 0 ]; then
          echo "No changed Python files to check."
          exit 0
        fi

        ruff check "${python_files[@]}"
        ruff format --check "${python_files[@]}"
      shell: bash


  docs-check:
    name: Check Sphinx docs build
    if: *run-ci
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
        persist-credentials: false

    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          docs:
            - 'docs/**'
            - 'docs/requirements-docs.txt'

    - name: Set up Python
      if: steps.filter.outputs.docs == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install documentation dependencies
      if: steps.filter.outputs.docs == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements-docs.txt

    - name: Build docs with strict mode
      if: steps.filter.outputs.docs == 'true'
      run: |
        cd docs
        make html SPHINXOPTS=-W
      shell: bash


  check-paths:
    if: *run-ci
    runs-on: ubuntu-latest
    outputs:
      should-run-downstream: ${{ steps.dispatch-override.outputs.src || steps.filter.outputs.src }}
      should-run-tent: ${{ steps.dispatch-override.outputs.tent || steps.filter.outputs.tent }}
    steps:
      # workflow_dispatch has no PR/push diff context — skip paths-filter and default to true
      - name: Default to true for workflow_dispatch
        id: dispatch-override
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "src=true" >> $GITHUB_OUTPUT
          echo "tent=true" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            src:
              - 'mooncake-*/**'
              - 'extern/**'
              - 'CMakeLists.txt'
              - 'dependencies.sh'
              - 'scripts/**'
              - '.github/actions/**'
              - '.github/workflows/**'
            tent:
              - 'mooncake-transfer-engine/**'
              - 'mooncake-common/**'
              - 'CMakeLists.txt'
              - 'dependencies.sh'
              - '.github/workflows/ci.yml'

  build-wheel-cu13:
    needs: [spell-check, clang-format, check-paths]
    if: *run-ci-for-source-changes
    uses: ./.github/workflows/_build-wheel.yaml
    with:
      variant: cuda13
      python-versions: '["3.12"]'
      artifact-prefix: mooncake-wheel-cu130
      version-override: 0.0.0.dev0

  build-wheel-efa:
    needs: [spell-check, clang-format, check-paths]
    if: *run-ci-for-source-changes
    uses: ./.github/workflows/ci_efa.yml
    secrets: inherit

  build-wheel-rocm:
    needs: [spell-check, clang-format, check-paths]
    if: >-
      (needs.check-paths.outputs.should-run-downstream == 'true' ||
       github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' ||
         contains(github.event.pull_request.labels.*.name, 'run-ci'))))
    uses: ./.github/workflows/ci_rocm.yml
    secrets: inherit

  tent-ci:
    needs: [spell-check, clang-format, check-paths]
    if: >-
      (needs.check-paths.outputs.should-run-tent == 'true' ||
       github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' ||
         contains(github.event.pull_request.labels.*.name, 'run-ci'))))
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cuda-on
            cmake_flags: '-DUSE_CUDA=ON -DCMAKE_EXE_LINKER_FLAGS=-L/usr/local/cuda/lib64/stubs'
            need_cuda: true
            metrics_flags: ''
          - name: cuda-off
            cmake_flags: '-DUSE_CUDA=OFF'
            need_cuda: false
            metrics_flags: ''
          - name: cuda-off-metrics-on
            cmake_flags: '-DUSE_CUDA=OFF'
            need_cuda: false
            metrics_flags: '-DTENT_METRICS_ENABLED=ON'
          # Exercise the native UB target with its injected mock adapter. A
          # Debug build also catches ODR/link errors hidden by optimization.
          - name: ub-mock
            cmake_flags: '-DUSE_CUDA=OFF -DUSE_UB=ON -DCMAKE_BUILD_TYPE=Debug'
            need_cuda: false
            metrics_flags: ''
    name: tent-ci (${{ matrix.name }})
    env:
      CI: "true"
      SCCACHE_GHA_ENABLED: "true"

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Free up disk space
      if: matrix.need_cuda
      uses: ./.github/actions/free-disk-space

    - name: Install CUDA Toolkit
      if: matrix.need_cuda
      uses: Jimver/cuda-toolkit@v0.2.24
      with:
        cuda: '12.8.1'
        linux-local-args: '["--toolkit"]'
        method: 'network'
        sub-packages: '["nvcc", "nvrtc-dev"]'

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Configure sccache
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt install -y ninja-build
        sudo bash -x dependencies.sh -y
        df -h
      shell: bash

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Configure project with TENT
      run: |
        mkdir build-tent
        cd build-tent
        cmake -G Ninja .. -DUSE_TENT=ON -DUSE_HTTP=ON -DENABLE_SCCACHE=ON -DBUILD_UNIT_TESTS=ON -DBUILD_EXAMPLES=ON -DENABLE_DEBUG_SYMBOLS=OFF ${{ matrix.cmake_flags }} ${{ matrix.metrics_flags }}
      shell: bash

    - name: Build project with TENT
      run: |
        if [ "${{ matrix.need_cuda }}" = "true" ]; then
          export LD_LIBRARY_PATH=/usr/local/cuda/lib64/stubs:$LD_LIBRARY_PATH
          export LIBRARY_PATH=/usr/local/cuda/lib64/stubs:$LIBRARY_PATH
        fi
        cd build-tent
        cmake --build .
        sudo cmake --install .
      shell: bash

    # Check the Transfer Engine Rust crate against the freshly built C++
    # libraries. This is a compile/link check, so it is safe to run on every
    # matrix leg (including the cuda-on leg, which only verifies that the
    # USE_CUDA code paths compile).
    - name: Check Transfer Engine Rust bindings, examples, and tests
      run: |
        if [ -f /usr/local/cuda/lib64/stubs/libcuda.so ] && \
           [ ! -e /usr/local/cuda/lib64/stubs/libcuda.so.1 ]; then
          sudo ln -s libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1
        fi
        if [ "${{ matrix.need_cuda }}" = "true" ]; then
          export LD_LIBRARY_PATH=/usr/local/cuda/lib64/stubs:$LD_LIBRARY_PATH
        fi
        cd mooncake-transfer-engine/rust
        export MOONCAKE_BUILD_DIR=$GITHUB_WORKSPACE/build-tent
        export MOONCAKE_TE_LIB_DIR=$GITHUB_WORKSPACE/build-tent/mooncake-transfer-engine/src
        export MOONCAKE_TE_INCLUDE_DIR=$GITHUB_WORKSPACE/mooncake-transfer-engine/include
        cargo test --lib
        cargo test --examples --tests --no-run
        cargo clean
      shell: bash

    # Only run tests on the cuda-off leg. GitHub runners have no real GPU;
    # with USE_CUDA=ON tent's cuda_probe hits the CUDA stub library at
    # runtime and drives some dispatch paths past the fake objects the
    # unit tests rely on, causing false failures. cuda-on still validates
    # that every #ifdef USE_CUDA branch compiles.
    - name: Test (TENT)
      id: ctest
      if: '!matrix.need_cuda'
      run: |
        cd build-tent
        mkdir -p test-results
        ctest --test-dir mooncake-transfer-engine/tent/tests -j \
          --output-on-failure \
          --output-junit "$GITHUB_WORKSPACE/build-tent/test-results/ctest.xml"
      shell: bash

    - name: Preserve TENT CTest diagnostics
      if: ${{ always() && steps.ctest.outcome == 'failure' }}
      uses: ./.github/actions/ctest-diagnostics
      with:
        summary-title: TENT CTest failure (${{ matrix.name }})
        artifact-name: ctest-diagnostics-tent-${{ matrix.name }}
        junit-report: build-tent/test-results/ctest.xml
        failed-tests-log: build-tent/mooncake-transfer-engine/tent/tests/Testing/Temporary/LastTestsFailed.log
        last-test-log: build-tent/mooncake-transfer-engine/tent/tests/Testing/Temporary/LastTest.log

    - name: Start Metadata Server
      if: '!matrix.need_cuda'
      run: |
        cd mooncake-transfer-engine/example/http-metadata-server-python
        pip install aiohttp
        python ./bootstrap_server.py &
        sleep 2
      shell: bash

    - name: Run Transfer Engine Rust smoke test
      if: '!matrix.need_cuda'
      env:
        MOONCAKE_BUILD_DIR: ${{ github.workspace }}/build-tent
        MOONCAKE_TE_RUST_LINK_ASAN: "0"
      run: ./scripts/ci/run_transfer_engine_rust_smoke.sh
      shell: bash

    - name: Run sccache stat for check
      if: ${{ env.SCCACHE_PATH != '' }}
      shell: bash
      run: ${SCCACHE_PATH} --show-stats

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - spell-check
      - clang-format
      - python-lint
      - docs-check
      - reshard-type-check
      - release-gate-tests
      - build-wheel
      - unit-tests
      - build-flags
      - test-wheel-ubuntu
      - build-wheel-cu13
      - build-wheel-efa
      - build-wheel-rocm
      - tent-ci
    runs-on: ubuntu-latest
    steps:
      - name: Check required job results
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[] |
            select(.value.result != "success" and .value.result != "skipped") |
            "\(.key): \(.value.result)"')
          if [ -n "$failing" ]; then
            echo "::error::The following jobs failed or were cancelled:"
            echo "$failing"
            exit 1
          fi
          echo "All checks passed or were acceptably skipped."
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
