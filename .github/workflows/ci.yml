name: 'Build & Test (Linux)'

on:
  push:
    branches:
      - "main"
      - "release/**"
  pull_request:
    branches:
      - "main"
      - "release/**"
    # `labeled` is intentionally omitted. Auto-labeler already applies
    # `run-ci`, so any new label (including `run-e2e-ci`) would retrigger
    # this whole workflow and cancel the in-progress run. Same-SHA
    # retrigger via the `run-ci` label lives in ci-on-label.yml.
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

# A branch push lets the running build finish: a full run outlasts the gap
# between merges, so cancelling on every push left main with no completed
# result. Newer pushes still replace the one pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  # Only push/schedule builds write: PR-scoped entries are invisible to
  # other PRs and would evict the main entries every PR reads.
  SCCACHE_GHA_RW_MODE: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'READ_WRITE' || 'READ_ONLY' }}

jobs:
  fast-checks:
    name: Fast lint, format, contract, and path checks
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.src }}
      tent: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.tent }}
      store_rs: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.store_rs }}
      docs: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.docs }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: dorny/paths-filter@v3
      if: github.event_name != 'workflow_dispatch'
      id: filter
      with:
        # PRs use their base branch; pushes compare against the previous push
        # on this ref, including release branches.
        base: ${{ github.event_name == 'push' && github.ref || '' }}
        filters: |
          src:
            - 'mooncake-common/**'
            - 'mooncake-conductor/**'
            - 'mooncake-ep/**'
            - 'mooncake-integration/**'
            - 'mooncake-p2p-store/**'
            - 'mooncake-pg/**'
            - 'mooncake-reshard/**'
            - 'mooncake-rl/**'
            - 'mooncake-store/**'
            - 'mooncake-transfer-engine/**'
            - 'mooncake-wheel/**'
            - 'extern/**'
            - 'cmake/**'
            - 'CMakeLists.txt'
            - 'dependencies.sh'
            - 'scripts/build_wheel.sh'
            - 'scripts/test_installation.sh'
            - 'scripts/run_standalone_store_e2e.sh'
            - 'scripts/test_upsert_api.py'
            - 'scripts/test_copy_move_api.py'
            - 'scripts/test_drain_http_api.py'
            - 'scripts/ci/check_wheel_typing.sh'
            - 'scripts/ci/wheel_typing/**'
            - 'scripts/ci/run_rpc_smoke.sh'
            - 'scripts/ci/run_ssd_offload_smoke.sh'
            - 'scripts/ci/run_store_api_smoke.sh'
            - 'scripts/ci/services.sh'
            - 'scripts/e2e/python/verify_rocm_wheel.py'
            - 'scripts/e2e/python/verify_xpu_wheel.py'
            - '.github/actions/**'
            - '.github/workflows/ci.yml'
            - '.github/workflows/_build-wheel.yaml'
            - '.github/workflows/ci_rocm.yml'
            - '.github/workflows/ci_xpu.yml'
          tent:
            - 'mooncake-transfer-engine/**'
            - 'mooncake-store/src/transfer_task.cpp'
            - 'mooncake-store/tests/transfer_task_test.cpp'
            - 'mooncake-store/tests/CMakeLists.txt'
            - 'mooncake-common/**'
            - 'extern/**'
            - 'cmake/**'
            - 'CMakeLists.txt'
            - 'dependencies.sh'
            - 'scripts/ci/run_tent_cpu_profile.sh'
            - 'scripts/ci/run_transfer_engine_rust_smoke.sh'
            - 'scripts/ci/services.sh'
            - '.github/actions/**'
            - '.github/workflows/ci.yml'
          store_rs:
            - 'mooncake-store-rs/**'
            - 'python/mooncake/store/__init__.py'
            - 'python/mooncake/store/rs/**'
            - 'python/tests/store/rs/**'
            - 'mooncake-common/include/**'
            - 'mooncake-common/FindYLT.cmake'
            - 'mooncake-transfer-engine/include/**'
            - 'mooncake-transfer-engine/tent/include/**'
            - 'scripts/ci/run_store_rs_smoke.sh'
            - 'CMakeLists.txt'
            - 'dependencies.sh'
            - '.github/workflows/ci.yml'
          docs:
            - 'docs/**'
            - '.github/workflows/ci.yml'

    - name: Spell Check Repo
      uses: crate-ci/typos@v1.30.2

    - name: Set up Python 3.10 and 3.12
      uses: actions/setup-python@v5
      with:
        python-version: |
          3.10
          3.12

    - name: Install Python check and format tools
      run: |
        python -m pip install --disable-pip-version-check \
          ruff==0.6.9 pyright==1.1.411 packaging pytest==8.3.5 pyyaml \
          clang-format==20.1.8 numpy msgpack hypothesis==6.141.0
        python3.10 -m pip install --disable-pip-version-check \
          numpy pytest msgpack hypothesis==6.141.0
      shell: bash

    - name: Check code format
      run: |
        # Check script exists and is executable
        if [[ ! -x ./scripts/code_format.sh ]]; then
          echo "Error: code_format.sh not found or not executable"
          exit 1
        fi

        # Determine base ref for comparison
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          # For PRs: compare against the target branch
          BASE_REF="origin/${{ github.base_ref }}"
        elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          # Manual runs have no previous push SHA.
          BASE_REF="origin/${{ github.event.repository.default_branch }}"
        else
          # For push events: use github.event.before to handle multi-commit pushes
          BEFORE_SHA="${{ github.event.before }}"
          if [ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]; then
            # New branch push, compare against default branch
            BASE_REF="origin/${{ github.event.repository.default_branch }}"
          else
            # Normal push (single or multiple commits)
            BASE_REF="${BEFORE_SHA}"
          fi
        fi
        echo "Comparing against: ${BASE_REF}"
        ./scripts/code_format.sh --check --changed-lines --base "${BASE_REF}"
      shell: bash

    - name: Check changed Python files
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base_ref="origin/${{ github.base_ref }}"
        elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          base_ref="origin/${{ github.event.repository.default_branch }}"
        elif [ "${{ github.event.before }}" = \
               "0000000000000000000000000000000000000000" ]; then
          base_ref="origin/${{ github.event.repository.default_branch }}"
        elif [ -n "${{ github.event.before }}" ]; then
          base_ref="${{ github.event.before }}"
        else
          base_ref="HEAD^"
        fi

        mapfile -d '' python_files < <(
          git diff --name-only --diff-filter=ACMR -z "$base_ref"...HEAD -- \
            '*.py' \
            ':(exclude)extern/**' \
            ':(exclude)FAST25-release/**'
        )
        if [ "${#python_files[@]}" -eq 0 ]; then
          echo "No changed Python files to check."
          exit 0
        fi

        ruff check "${python_files[@]}"
        python scripts/ci/check_changed_python_format.py \
          "$base_ref" "${python_files[@]}"
      shell: bash

    - name: Check canonical reshard contract types
      run: bash scripts/check_reshard_types.sh
      shell: bash

    - name: Run focused release gate tests
      run: python -m pytest -q mooncake-wheel/tests/test_testpypi_wheel_gate.py
      shell: bash

    - name: Test CI service and smoke scripts
      run: python -m unittest discover -s scripts/ci/tests -v
      shell: bash

    - name: Run focused shell regression tests
      run: |
        bash scripts/tone_tests/tests/test_common_cleanup.sh
        python3 -m unittest discover -s scripts/tone_tests/tests -p 'test_*.py'
      shell: bash

    - name: Run CPU table, facade and range-plan contracts without a native build
      env:
        # mooncake-wheel holds the pure-Python modules the installed wheel
        # merges into the package, such as mooncake._partial_read.
        PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}/mooncake-wheel
      run: |
        for py in python3.10 python3.12; do
          echo "=== Running Engram CPU contracts with ${py} ==="
          "${py}" -m pytest -q scripts/test_engram_tables.py python/tests/store/test_facade.py python/tests/store/test_structured_ranges_properties.py
        done
      shell: bash

  # Build the artifact tested below through the exact release wheel path. The
  # Ubuntu jobs remain consumer tests, not an alternate wheel build environment.
  build-wheel:
    needs: [fast-checks]
    if: &run-ci-for-source-changes needs.fast-checks.outputs.src == 'true'
    uses: ./.github/workflows/_build-wheel.yaml
    with:
      python-versions: '["3.10", "3.12"]'
      artifact-prefix: mooncake-wheel-ci
      version-override: 0.0.0.dev0

  test-wheel-ubuntu:
    needs: [build-wheel]
    strategy:
      matrix:
        include:
          - ubuntu-version: ubuntu-22.04
            python-version: '3.12'
            artifact: mooncake-wheel-ci-py312
            torch-pip-extra-args: ''
          - ubuntu-version: ubuntu-24.04
            python-version: '3.10'
            artifact: mooncake-wheel-ci-py310
            torch-pip-extra-args: '--index-url https://download.pytorch.org/whl/cpu'
    runs-on: ${{ matrix.ubuntu-version }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download wheel artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: mooncake-wheel/dist

    - name: Verify wheel file exists
      run: |
        ls -la mooncake-wheel/dist/
        if [ ! -f mooncake-wheel/dist/*.whl ]; then
          echo "ERROR: No wheel file found in mooncake-wheel/dist/"
          exit 1
        fi
      shell: bash

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.24
      with:
        cuda: '12.8.1'
        linux-local-args: '["--toolkit"]'
        method: 'network'
        sub-packages: '["nvcc"]'

    - name: Configure CUDA stub and PG JIT headers
      run: |
        if [ "${{ matrix.ubuntu-version }}" = "ubuntu-22.04" ] && \
           [ "${{ matrix.python-version }}" = "3.12" ]; then
          # PyTorch's ATen/cuda/CUDAContext.h includes cuBLAS/cuSPARSE/cuSOLVER/cuRAND
          # headers from /usr/local/cuda/include when JIT-compiling mooncake-pg.
          sudo apt-get install -y --no-install-recommends \
            libcublas-dev-12-8 \
            libcusparse-dev-12-8 \
            libcusolver-dev-12-8 \
            libcurand-dev-12-8
        fi

        cuda_stub=""
        for candidate in /usr/local/cuda/lib64/stubs/libcuda.so \
                         /usr/local/cuda/targets/*/lib/stubs/libcuda.so; do
          if [ -f "$candidate" ]; then
            cuda_stub="$candidate"
            break
          fi
        done
        if [ -z "$cuda_stub" ]; then
          echo "::error::CUDA driver stub libcuda.so not found"
          exit 1
        fi
        stub_dir="$(dirname "$cuda_stub")"
        if [ ! -e "$stub_dir/libcuda.so.1" ]; then
          sudo ln -s "$(basename "$cuda_stub")" "$stub_dir/libcuda.so.1"
        fi
        echo "LD_LIBRARY_PATH=$stub_dir:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
        echo "LIBRARY_PATH=$stub_dir:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      shell: bash

    - name: Run installation test script
      env:
        TORCH_PIP_EXTRA_ARGS: ${{ matrix.torch-pip-extra-args }}
      run: |
        bash scripts/test_installation.sh
      shell: bash

    - name: Run in-process master e2e tests (no mooncake_master)
      run: |
        source test_env/bin/activate
        bash scripts/run_standalone_store_e2e.sh
        deactivate
      shell: bash

    - name: Run tensor snapshot regressions
      env:
        MASTER_SERVER: "127.0.0.1:50061"
        MC_METADATA_SERVER: "P2PHANDSHAKE"
        LOCAL_HOSTNAME: "127.0.0.1"
        DEFAULT_KV_LEASE_TTL: "500"
      run: |
        source test_env/bin/activate
        export LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}:/usr/local/lib
        mooncake_master --port 50061 --default_kv_lease_ttl=500 \
          >"$RUNNER_TEMP/tensor-snapshot-master.log" 2>&1 &
        master_pid=$!
        trap 'kill "$master_pid" 2>/dev/null || true; wait "$master_pid" 2>/dev/null || true' EXIT
        python - <<'PY'
        import socket
        import time
        for attempt in range(100):
            try:
                with socket.create_connection(("127.0.0.1", 50061), timeout=0.2):
                    break
            except OSError:
                time.sleep(0.1)
        else:
            raise RuntimeError("Tensor snapshot test master did not start")
        PY
        python mooncake-wheel/tests/test_tensor_read_snapshot.py -v
        python mooncake-wheel/tests/test_cuda_fabric_compat.py -v
      shell: bash

    - name: Run session and HCA write metadata regressions
      run: |
        source test_env/bin/activate
        export LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}:/usr/local/lib
        python -m pip install pyzmq msgpack
        export MOONCAKE_TEST_MASTER_BINARY="$(command -v mooncake_master)"
        for affinity in 0 1; do
          MC_STORE_HCA_AFFINITY="$affinity" \
            python -m pytest -q mooncake-wheel/tests/test_session_kv_events.py
        done
      shell: bash

    - name: Run all PG CPU tests with installed PyTorch
      if: matrix.ubuntu-version == 'ubuntu-22.04' && matrix.python-version == '3.12'
      env:
        MC_FORCE_TCP: "true"
        # The runner has CUDA headers/nvcc but no usable GPU for arch detection.
        TORCH_CUDA_ARCH_LIST: "8.0"
      run: |
        source test_env/bin/activate
        export LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}:/usr/local/lib
        python -m unittest discover -s mooncake-pg/tests -k CPU -v
      shell: bash

    - name: Run Store API and RPC smoke tests
      if: matrix.ubuntu-version == 'ubuntu-22.04' && matrix.python-version == '3.12'
      env:
        MOONCAKE_MASTER: "127.0.0.1:50051"
        MOONCAKE_TE_META_DATA_SERVER: "http://127.0.0.1:8080/metadata"
        MOONCAKE_PROTOCOL: "tcp"
        LOCAL_HOSTNAME: "127.0.0.1"
      run: |
        source test_env/bin/activate
        export LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}:/usr/local/lib
        python -m pip install safetensors

        reserved_ports=$(sysctl -n net.ipv4.ip_local_reserved_ports)
        sudo sysctl -w \
          "net.ipv4.ip_local_reserved_ports=${reserved_ports:+$reserved_ports,}50052"

        ./scripts/ci/run_store_api_smoke.sh
        ./scripts/ci/run_rpc_smoke.sh
      shell: bash

    - name: Run SSD offload and promotion end-to-end tests
      if: matrix.ubuntu-version == 'ubuntu-22.04' && matrix.python-version == '3.12'
      run: |
        source test_env/bin/activate
        ./scripts/ci/run_ssd_offload_smoke.sh
      shell: bash

  unit-tests:
    name: CTest unit tests (Python 3.12)
    needs: [fast-checks]
    if: *run-ci-for-source-changes
    runs-on: ubuntu-22.04
    env:
      CI: "true"
      SCCACHE_GHA_ENABLED: "true"
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Mooncake Store Rust Cargo artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: mooncake-store/rust

    - name: Install and start etcd
      uses: ./.github/actions/setup-etcd

    - name: Free up disk space
      uses: ./.github/actions/free-disk-space

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.24
      with:
        cuda: '12.8.1'
        linux-local-args: '["--toolkit"]'
        method: 'network'
        sub-packages: '["nvcc"]'

    - name: Install build utilities and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build lld
        sudo bash -x dependencies.sh -y
        echo "/usr/local/go/bin" >> "$GITHUB_PATH"
      shell: bash

    - name: Set up compiler cache
      uses: ./.github/actions/setup-sccache

    # Every default wheel carries the EFA transport (USE_EFA=ON), but the EFA
    # unit tests only build with USE_EFA=ON and BUILD_UNIT_TESTS=ON, which no
    # wheel build sets. Fetch the oldest libfabric API the transport accepts
    # (dlopen'ed at runtime) so EFA tests compile and non-hardware ones run here.
    - name: Fetch libfabric headers
      env:
        LIBFABRIC_HEADERS_VERSION: "1.18.3"
      run: |
        dest="$RUNNER_TEMP/libfabric-headers"
        mkdir -p "$dest"
        curl --retry 3 --retry-delay 2 -fsSL \
          "https://github.com/ofiwg/libfabric/archive/refs/tags/v${LIBFABRIC_HEADERS_VERSION}.tar.gz" |
          tar xz -C "$dest" --strip-components=1 "libfabric-${LIBFABRIC_HEADERS_VERSION}/include/rdma"
        test -f "$dest/include/rdma/fabric.h"
      shell: bash

    - name: Configure project with unit tests
      run: |
        cmake -S . -B build -G Ninja \
          -DUSE_HTTP=ON \
          -DUSE_CXL=ON \
          -DUSE_UB=ON \
          -DUSE_ETCD=ON \
          -DUSE_REDIS=ON \
          -DUSE_CUDA=ON \
          -DUSE_MNNVL=ON \
          -DUSE_EFA=ON \
          -DLIBFABRIC_INCLUDE_DIR="$RUNNER_TEMP/libfabric-headers/include" \
          -DWITH_P2P_STORE=ON \
          -DWITH_CONDUCTOR=ON \
          -DSTORE_USE_ETCD=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_UNIT_TESTS=ON \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_BENCHMARK=OFF \
          -DENABLE_DEBUG_SYMBOLS=OFF \
          -DUSE_LLD=ON \
          -DENABLE_SCCACHE=ON
      shell: bash

    - name: Configure CUDA driver runtime
      uses: ./.github/actions/setup-cuda-runtime

    - name: Build project and unit tests
      run: |
        cmake --build build --parallel 2
        sudo -E cmake --install build
      shell: bash

    - name: Run sccache stat for check
      if: ${{ env.SCCACHE_PATH != '' }}
      shell: bash
      run: ${SCCACHE_PATH} --show-stats

    - name: Run Mooncake Store Rust unit tests
      env:
        MOONCAKE_BUILD_DIR: ${{ github.workspace }}/build
        MOONCAKE_STORE_LIB_DIR: ${{ github.workspace }}/build/mooncake-store/src
        MOONCAKE_STORE_INCLUDE_DIR: ${{ github.workspace }}/mooncake-store/include
      run: |
        export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/build/mooncake-asio:$GITHUB_WORKSPACE/build/mooncake-store/src:$GITHUB_WORKSPACE/build/mooncake-store/src/cachelib_memory_allocator:$GITHUB_WORKSPACE/build/mooncake-transfer-engine/src:$GITHUB_WORKSPACE/build/mooncake-transfer-engine/src/common/base:$GITHUB_WORKSPACE/build/mooncake-common/etcd:/usr/local/lib:${LD_LIBRARY_PATH:-}"
        cargo test --manifest-path mooncake-store/rust/Cargo.toml --lib
      shell: bash

    - name: Start Metadata Server
      uses: ./.github/actions/setup-metadata-server

    - name: Run all CTest unit tests
      id: ctest
      uses: ./.github/actions/run-ctest
      with:
        junit-report: build/test-results/ctest.xml
        label-exclude: '^(nvlink_gpu|efa_hw)$'

    - name: Preserve CTest diagnostics
      if: ${{ always() && steps.ctest.outcome == 'failure' }}
      uses: ./.github/actions/ctest-diagnostics
      with:
        summary-title: PR CTest failure
        artifact-name: ctest-diagnostics-pr
        junit-report: build/test-results/ctest.xml
        failed-tests-log: build/Testing/Temporary/LastTestsFailed.log
        last-test-log: build/Testing/Temporary/LastTest.log

  docs-check:
    name: Check Sphinx docs build
    needs: [fast-checks]
    if: needs.fast-checks.outputs.docs == 'true'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements-docs.txt

    - name: Build docs with strict mode
      working-directory: docs
      run: make html SPHINXOPTS=-W

  build-wheel-cu13:
    needs: [fast-checks]
    if: *run-ci-for-source-changes
    uses: ./.github/workflows/_build-wheel.yaml
    with:
      variant: cuda13
      python-versions: '["3.12"]'
      artifact-prefix: mooncake-wheel-cu130
      version-override: 0.0.0.dev0
      # This artifact feeds the T-One e2e pipeline (integration-test.yml picks
      # the py312/cu130 wheel), which exercises the TENT runtime. Default
      # engine behavior stays classic; TENT activates via MC_USE_TENT=1 set
      # by tone_tests/scripts/common.sh.
      use-tent: true

  # arm64 default wheels use a different transport set (USE_MNNVL) than
  # x86_64 (USE_INTRA_NVLINK), so build one here instead of only at release.
  build-wheel-cu13-arm64:
    needs: [fast-checks]
    if: *run-ci-for-source-changes
    uses: ./.github/workflows/_build-wheel.yaml
    with:
      variant: cuda13
      architecture: arm64
      python-versions: '["3.12"]'
      artifact-prefix: mooncake-wheel-cu130-arm64
      version-override: 0.0.0.dev0

  build-wheel-rocm:
    needs: [fast-checks]
    if: *run-ci-for-source-changes
    uses: ./.github/workflows/ci_rocm.yml
    with:
      # PR CI validates ROCm C++/HIP compilation, wheel repair, and smoke
      # import once on Python 3.12; e2e-ci.yml and nightly.yml build 3.10 & 3.12.
      python_versions: '["3.12"]'
    secrets: inherit

  build-wheel-xpu:
    needs: [fast-checks]
    if: *run-ci-for-source-changes
    uses: ./.github/workflows/ci_xpu.yml

  tent-ci:
    needs: [fast-checks]
    if: needs.fast-checks.outputs.tent == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cuda-on
            need_cuda: true
          - name: cpu
            need_cuda: false
    name: tent-ci (${{ matrix.name }})
    env:
      CI: "true"
      SCCACHE_GHA_ENABLED: "true"

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Free up disk space
      if: matrix.need_cuda
      uses: ./.github/actions/free-disk-space

    - name: Install CUDA Toolkit
      if: matrix.need_cuda
      uses: Jimver/cuda-toolkit@v0.2.24
      with:
        cuda: '12.8.1'
        linux-local-args: '["--toolkit"]'
        method: 'network'
        sub-packages: '["nvcc", "nvrtc-dev"]'

    - name: Set up compiler cache
      uses: ./.github/actions/setup-sccache

    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt install -y ninja-build lld
        sudo bash -x dependencies.sh -y
        df -h
      shell: bash

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Transfer Engine Rust Cargo artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: mooncake-transfer-engine/rust
        prefix-key: v0-rust-te-${{ matrix.name }}

    - name: Configure project with TENT (cuda-on)
      if: matrix.need_cuda
      run: |
        mkdir build-tent
        cd build-tent
        cmake -G Ninja .. \
          -DUSE_TENT=ON \
          -DUSE_HTTP=ON \
          -DENABLE_SCCACHE=ON \
          -DBUILD_UNIT_TESTS=ON \
          -DBUILD_EXAMPLES=ON \
          -DBUILD_BENCHMARK=OFF \
          -DUSE_LLD=ON \
          -DENABLE_DEBUG_SYMBOLS=OFF \
          -DUSE_CUDA=ON \
          -DCMAKE_EXE_LINKER_FLAGS=-L/usr/local/cuda/lib64/stubs \
          -DWITH_STORE=OFF \
          -DWITH_STORE_RUST=OFF
      shell: bash

    - name: Build project with TENT (cuda-on)
      if: matrix.need_cuda
      run: |
        export LD_LIBRARY_PATH=/usr/local/cuda/lib64/stubs:${LD_LIBRARY_PATH:-}
        export LIBRARY_PATH=/usr/local/cuda/lib64/stubs:${LIBRARY_PATH:-}
        cd build-tent
        cmake --build .
        sudo cmake --install .
      shell: bash

    # Check the Transfer Engine Rust crate against the freshly built C++
    # libraries on cuda-on (the cpu leg runs the full smoke script per profile).
    - name: Check Transfer Engine Rust bindings, examples, and tests
      if: matrix.need_cuda
      run: |
        if [ -f /usr/local/cuda/lib64/stubs/libcuda.so ] && \
           [ ! -e /usr/local/cuda/lib64/stubs/libcuda.so.1 ]; then
          sudo ln -s libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1
        fi
        export LD_LIBRARY_PATH=/usr/local/cuda/lib64/stubs:$LD_LIBRARY_PATH
        cd mooncake-transfer-engine/rust
        export MOONCAKE_BUILD_DIR=$GITHUB_WORKSPACE/build-tent
        export MOONCAKE_TE_LIB_DIR=$GITHUB_WORKSPACE/build-tent/mooncake-transfer-engine/src
        export MOONCAKE_TE_INCLUDE_DIR=$GITHUB_WORKSPACE/mooncake-transfer-engine/include
        cargo test --lib
        cargo test --examples --tests --no-run
      shell: bash

    - name: Install Python test dependencies
      if: '!matrix.need_cuda'
      run: python3 -m pip install --disable-pip-version-check aiohttp
      shell: bash

    - name: Build standalone Transfer Engine flags check (build-flags)
      if: '!matrix.need_cuda'
      run: ./scripts/ci/run_tent_cpu_profile.sh build-flags
      shell: bash

    - name: Build & test TENT (cuda-off)
      id: ctest_cuda_off
      if: '!matrix.need_cuda'
      run: ./scripts/ci/run_tent_cpu_profile.sh cuda-off
      shell: bash

    - name: Preserve TENT CTest diagnostics (cuda-off)
      if: ${{ always() && !matrix.need_cuda && steps.ctest_cuda_off.outcome == 'failure' }}
      uses: ./.github/actions/ctest-diagnostics
      with:
        summary-title: TENT CTest failure (cuda-off)
        artifact-name: ctest-diagnostics-tent-cuda-off
        junit-report: build-tent-cuda-off/test-results/ctest.xml
        failed-tests-log: build-tent-cuda-off/mooncake-transfer-engine/tent/tests/Testing/Temporary/LastTestsFailed.log
        last-test-log: build-tent-cuda-off/mooncake-transfer-engine/tent/tests/Testing/Temporary/LastTest.log

    - name: Build & test TENT (cuda-off-metrics-on)
      id: ctest_metrics
      if: '!matrix.need_cuda'
      run: ./scripts/ci/run_tent_cpu_profile.sh cuda-off-metrics-on
      shell: bash

    - name: Preserve TENT CTest diagnostics (cuda-off-metrics-on)
      if: ${{ always() && !matrix.need_cuda && steps.ctest_metrics.outcome == 'failure' }}
      uses: ./.github/actions/ctest-diagnostics
      with:
        summary-title: TENT CTest failure (cuda-off-metrics-on)
        artifact-name: ctest-diagnostics-tent-cuda-off-metrics-on
        junit-report: build-tent-cuda-off-metrics-on/test-results/ctest.xml
        failed-tests-log: build-tent-cuda-off-metrics-on/mooncake-transfer-engine/tent/tests/Testing/Temporary/LastTestsFailed.log
        last-test-log: build-tent-cuda-off-metrics-on/mooncake-transfer-engine/tent/tests/Testing/Temporary/LastTest.log

    - name: Build & test TENT (ub-mock)
      id: ctest_ub
      if: '!matrix.need_cuda'
      run: ./scripts/ci/run_tent_cpu_profile.sh ub-mock
      shell: bash

    - name: Preserve TENT CTest diagnostics (ub-mock)
      if: ${{ always() && !matrix.need_cuda && steps.ctest_ub.outcome == 'failure' }}
      uses: ./.github/actions/ctest-diagnostics
      with:
        summary-title: TENT CTest failure (ub-mock)
        artifact-name: ctest-diagnostics-tent-ub-mock
        junit-report: build-tent-ub-mock/test-results/ctest.xml
        failed-tests-log: build-tent-ub-mock/mooncake-transfer-engine/tent/tests/Testing/Temporary/LastTestsFailed.log
        last-test-log: build-tent-ub-mock/mooncake-transfer-engine/tent/tests/Testing/Temporary/LastTest.log

    - name: Build & test TENT (memfabric-mock)
      id: ctest_memfabric
      if: '!matrix.need_cuda'
      run: ./scripts/ci/run_tent_cpu_profile.sh memfabric-mock
      shell: bash

    - name: Preserve TENT CTest diagnostics (memfabric-mock)
      if: ${{ always() && !matrix.need_cuda && steps.ctest_memfabric.outcome == 'failure' }}
      uses: ./.github/actions/ctest-diagnostics
      with:
        summary-title: TENT CTest failure (memfabric-mock)
        artifact-name: ctest-diagnostics-tent-memfabric-mock
        junit-report: build-tent-memfabric-mock/test-results/ctest.xml
        failed-tests-log: build-tent-memfabric-mock/mooncake-transfer-engine/tent/tests/Testing/Temporary/LastTestsFailed.log
        last-test-log: build-tent-memfabric-mock/mooncake-transfer-engine/tent/tests/Testing/Temporary/LastTest.log

    - name: Run sccache stat for check
      if: ${{ env.SCCACHE_PATH != '' }}
      shell: bash
      run: ${SCCACHE_PATH} --show-stats

  store-rs-ci:
    name: Store-RS Classic TE smoke
    needs: [fast-checks]
    if: needs.fast-checks.outputs.store_rs == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CI: "true"
      SCCACHE_GHA_ENABLED: "true"
      MOONCAKE_ROOT_DIR: ${{ github.workspace }}
      MOONCAKE_STORE_RS_DIR: ${{ github.workspace }}/mooncake-store-rs
      MOONCAKE_BUILD_DIR: ${{ github.workspace }}/build/store-rs-ci
      MOONCAKE_PYTHON_PREFIX: ${{ github.workspace }}/build/store-rs-python-prefix
      MOONCAKE_CLASSIC_SHIM_LIB_PATH: ${{ github.workspace }}/build/store-rs-ci/mooncake-store-rs/native-shims/libmooncake_classic_shim.so
      MOONCAKE_TENT_SHIM_LIB_PATH: ${{ github.workspace }}/build/store-rs-ci/mooncake-store-rs/native-shims/libmooncake_tent_shim.so
      MOONCAKE_PYTHON_BIN: python3
      MC_STORE_RS_CHECK_CPP_FACADE: "false"

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Show Rust toolchain versions
      run: |
        rustc --version --verbose
        cargo --version
        cargo clippy --version
        rustfmt --version

    - name: Check Store-RS Rust formatting
      run: cargo fmt --all --manifest-path mooncake-store-rs/Cargo.toml -- --check

    - name: Cache Store-RS Cargo artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          mooncake-store-rs -> ../build/store-rs-ci/mooncake-store-rs/cargo-cli
          mooncake-store-rs -> ../build/store-rs-ci/mooncake-store-rs/cargo-python
          mooncake-store-rs -> ../build/store-rs-ci/mooncake-store-rs/cargo-tests

    - name: Set up compiler cache
      uses: ./.github/actions/setup-sccache

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build lld redis-server redis-tools
        sudo bash -x dependencies.sh -y
        python -m pip install --disable-pip-version-check numpy pybind11
      shell: bash

    - name: Configure Store-RS
      run: |
        # Store-RS's current CMake integration requires both native shims, even
        # though this PR gate exercises only the Classic TE data path.
        cmake -S "$MOONCAKE_ROOT_DIR" -B "$MOONCAKE_BUILD_DIR" -G Ninja \
          -DSKBUILD=ON \
          -DPython3_EXECUTABLE="$(command -v python3)" \
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" \
          -DWITH_STORE=OFF \
          -DWITH_STORE_RUST=OFF \
          -DWITH_STORE_RS=ON \
          -DWITH_TE=ON \
          -DUSE_TENT=ON \
          -DUSE_REDIS=ON \
          -DUSE_CUDA=OFF \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_BENCHMARK=OFF \
          -DBUILD_UNIT_TESTS=OFF \
          -DBUILD_SHARED_LIBS=ON \
          -DUSE_LLD=ON \
          -DENABLE_SCCACHE=ON \
          -DCMAKE_BUILD_TYPE=Release
      shell: bash

    - name: Build Store-RS and native shims
      run: |
        cmake --build "$MOONCAKE_BUILD_DIR" \
          --target _fast_copy engine build_store_rs \
          --parallel "$(nproc)"
      shell: bash

    - name: Lint Store-RS Rust crates
      run: |
        PYO3_PYTHON="$(command -v python3)"
        CARGO_TARGET_DIR="$MOONCAKE_BUILD_DIR/mooncake-store-rs/cargo-tests"
        export PYO3_PYTHON CARGO_TARGET_DIR
        source "$MOONCAKE_STORE_RS_DIR/scripts/lib/common.sh"
        mc_scripts_setup_upstream_runtime_env none
        cargo clippy \
          --manifest-path "$MOONCAKE_STORE_RS_DIR/Cargo.toml" \
          --workspace --lib --bins --release -- -D warnings
      shell: bash

    - name: Install Store-RS Python component
      run: |
        cmake --install "$MOONCAKE_BUILD_DIR" --component python \
          --prefix "$MOONCAKE_PYTHON_PREFIX"
        mkdir -p "$MOONCAKE_PYTHON_PREFIX/mooncake"
        cp -a "$MOONCAKE_ROOT_DIR/python/mooncake/." \
          "$MOONCAKE_PYTHON_PREFIX/mooncake/"
      shell: bash

    - name: Run Store-RS Classic TE smoke
      run: ./scripts/ci/run_store_rs_smoke.sh
      shell: bash

    - name: Run sccache stat for check
      if: ${{ env.SCCACHE_PATH != '' }}
      shell: bash
      run: ${SCCACHE_PATH} --show-stats

  ci-gate:
    name: CI Gate
    # A cancelled branch push run reports no result rather than a failed gate.
    # Everywhere else the gate must fail: a skipped gate would satisfy the
    # required check for a PR head whose run was cancelled.
    if: ${{ (github.event_name != 'push' && always()) || !cancelled() }}
    needs:
      - fast-checks
      - docs-check
      - build-wheel
      - unit-tests
      - test-wheel-ubuntu
      - build-wheel-cu13
      - build-wheel-cu13-arm64
      - build-wheel-rocm
      - build-wheel-xpu
      - tent-ci
      - store-rs-ci
    runs-on: ubuntu-latest
    steps:
      # Each path-gated group must succeed when selected and be skipped otherwise.
      # A failed selector must never turn skipped builds into a successful gate.
      - name: Check unconditional jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          PASSED: ${{ needs.fast-checks.result == 'success' }}
        run: |
          echo "$NEEDS_JSON"
          test "$PASSED" = true

      - name: Check source jobs
        env:
          EXPECTED: ${{ needs.fast-checks.outputs.src == 'true' && 'success' || 'skipped' }}
          RESULTS: >-
            ${{ needs.build-wheel.result }}
            ${{ needs.unit-tests.result }}
            ${{ needs.test-wheel-ubuntu.result }}
            ${{ needs.build-wheel-cu13.result }}
            ${{ needs.build-wheel-cu13-arm64.result }}
            ${{ needs.build-wheel-rocm.result }}
            ${{ needs.build-wheel-xpu.result }}
        run: |
          for result in $RESULTS; do
            test "$result" = "$EXPECTED" || exit 1
          done

      - name: Check TENT jobs
        env:
          EXPECTED: ${{ needs.fast-checks.outputs.tent == 'true' && 'success' || 'skipped' }}
          RESULT: ${{ needs.tent-ci.result }}
        run: test "$RESULT" = "$EXPECTED"

      - name: Check Store-RS job
        env:
          EXPECTED: ${{ needs.fast-checks.outputs.store_rs == 'true' && 'success' || 'skipped' }}
          RESULT: ${{ needs.store-rs-ci.result }}
        run: test "$RESULT" = "$EXPECTED"

      - name: Check documentation job
        env:
          EXPECTED: ${{ needs.fast-checks.outputs.docs == 'true' && 'success' || 'skipped' }}
          RESULT: ${{ needs.docs-check.result }}
        run: test "$RESULT" = "$EXPECTED"
