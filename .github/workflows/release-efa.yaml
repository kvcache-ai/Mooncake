name: Release EFA

on:
  push:
    # Stable tags only (vX.Y.Z or vX.Y.Z.postN). PEP 440 pre-release tags
    # such as v0.3.14rc1 must not reach production PyPI; pre-release.yaml
    # handles them.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.post[0-9]+'

# Publishes mooncake-transfer-engine-efa, the CUDA 12-aware AWS EFA wheel.
jobs:
  build:
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86_64, arm64]
    uses: ./.github/workflows/_build-efa-wheel.yaml
    with:
      architecture: ${{ matrix.architecture }}
      variant: cuda
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      build-profile: release
      cmake-args: >-
        -DUSE_HTTP=ON -DUSE_ETCD=ON -DWITH_EP=OFF -DSTORE_USE_ETCD=ON
      artifact-prefix: mooncake-wheel-efa

  publish-release:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: build
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/_publish-wheel.yaml
    with:
      artifact-pattern: 'mooncake-wheel-efa-py*'
    secrets:
      pypi-token: ${{ secrets.PYPI_API_TOKEN }}
