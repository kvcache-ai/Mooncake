name: Pre-Release

# Build the same core wheel matrix as the stable release workflows and attach
# the artifacts to a GitHub Pre-release. Also publish the exact artifacts to
# TestPyPI, then consume them in smoke and T-one tests. No production PyPI upload.
on:
  push:
    tags:
      - 'v*-rc*'
      - 'v*-alpha*'
      - 'v*-beta*'
      - 'v*-pre*'

jobs:
  version-stamp:
    name: Normalize pre-release version
    if: github.repository == 'kvcache-ai/Mooncake'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - name: Checkout release gate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install version parser
        run: python -m pip install packaging

      - name: Normalize tag as a PEP 440 pre-release
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          normalized=$(python scripts/ci/testpypi_wheel_gate.py \
            normalize-version --tag "$RELEASE_TAG")
          echo "package_version=${normalized}" >> "$GITHUB_OUTPUT"
          echo "Normalized ${RELEASE_TAG} to ${normalized}"

  build:
    needs: version-stamp
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
            architecture: x86_64
            artifact-prefix: mooncake-wheel-pre-release
          - variant: cuda
            architecture: arm64
            artifact-prefix: mooncake-wheel-arm64-pre-release
          - variant: cuda13
            architecture: x86_64
            artifact-prefix: mooncake-wheel-cuda13-pre-release
          - variant: cuda13
            architecture: arm64
            artifact-prefix: mooncake-wheel-cuda13-arm64-pre-release
          - variant: non-cuda
            architecture: x86_64
            artifact-prefix: mooncake-wheel-non-cuda-pre-release
          - variant: non-cuda
            architecture: arm64
            artifact-prefix: mooncake-wheel-non-cuda-arm64-pre-release
    uses: ./.github/workflows/_build-wheel.yaml
    with:
      variant: ${{ matrix.variant }}
      architecture: ${{ matrix.architecture }}
      artifact-prefix: ${{ matrix.artifact-prefix }}
      version-override: ${{ needs.version-stamp.outputs.package_version }}


  build-npu:
    name: Build NPU wheels (${{ matrix.arch }}, py${{ matrix.python-version }})
    needs: version-stamp
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        include:
          - arch: aarch64
            runner: ubuntu-22.04-arm
            cann_arch: aarch64
          - arch: x86_64
            runner: ubuntu-22.04
            cann_arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      NPU_BUILD: "1"
      WHEEL_VERSION: ${{ needs.version-stamp.outputs.package_version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set Python bin
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python${{ matrix.python-version }})"
          "$PYTHON_BIN" --version
          echo "PYTHON_BIN=${PYTHON_BIN}" >> "$GITHUB_ENV"

      - name: Install CANN Toolkit
        shell: bash
        run: |
          set -euo pipefail
          CANN_BASE_URL="https://ascend.devcloud.huaweicloud.com/cann/run/software"
          CANN_VERSION=$(curl -s "${CANN_BASE_URL}/" | grep -oP '[0-9]+\.[0-9]+\.[0-9]+(?=/)' | sort -V | tail -1)
          echo "Latest CANN version: ${CANN_VERSION}"
          CANN_URL="${CANN_BASE_URL}/${CANN_VERSION}/${{ matrix.cann_arch }}/Ascend-cann-toolkit_${CANN_VERSION}_linux-${{ matrix.cann_arch }}.run"
          echo "Downloading CANN ${CANN_VERSION} from ${CANN_URL}"
          wget -q --show-progress -O /tmp/cann_toolkit.run "${CANN_URL}"
          chmod +x /tmp/cann_toolkit.run
          sudo /tmp/cann_toolkit.run --install --install-for-all --install-path=/usr/local/Ascend --quiet
          rm -f /tmp/cann_toolkit.run

      - name: Build and install HIXL
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
          source /usr/local/Ascend/cann/set_env.sh
          sudo ${PYTHON_BIN} -m pip install setuptools
          cd /tmp
          git clone https://gitcode.com/cann/hixl.git
          cd hixl
          bash build.sh -j$(nproc)
          sudo ./build_out/cann-hixl_*.run --full --quiet --pylocal --install-path=/usr/local/Ascend

      - name: Install dependencies
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
          source /usr/local/Ascend/cann/set_env.sh
          sudo bash dependencies.sh -y
          sudo bash scripts/ascend/dependencies_ascend_installation.sh

      - name: Configure project
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
          source /usr/local/Ascend/cann/set_env.sh
          rm -rf build
          mkdir build
          cd build
          cmake ..             -DUSE_ASCEND_DIRECT=ON             -DUSE_ETCD=ON             -DSTORE_USE_ETCD=ON             -DBUILD_UNIT_TESTS=OFF             -DCMAKE_BUILD_TYPE=Release             -DPython3_EXECUTABLE="${PYTHON_BIN}"             -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=OFF             -DCMAKE_BUILD_WITH_INSTALL_RPATH=OFF             -DCMAKE_SKIP_INSTALL_RPATH=ON

      - name: Build project
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
          source /usr/local/Ascend/cann/set_env.sh
          cd build
          cmake --build . -j"$(nproc)"
          sudo cmake --install .

      - name: Generate Python version tag
        id: generate_tag_release
        shell: bash
        run: |
          echo "python_version_tag=$(echo ${{ matrix.python-version }} | tr -d '.')" >> $GITHUB_OUTPUT

      - name: Patch wheel version in pyproject.toml
        run: |
          cd mooncake-wheel
          sed -i "s/^version = .*/version = \"${WHEEL_VERSION}\"/" pyproject.toml
          echo "Patched pyproject.toml version to: ${WHEEL_VERSION}"

      - name: Build Python wheel
        shell: bash
        run: |
          set -eo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
          source /usr/local/Ascend/cann/set_env.sh
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
          NPU_BUILD=1 PYTHON_VERSION=${{ matrix.python-version }} \
            OUTPUT_DIR=dist-npu-py${{ steps.generate_tag_release.outputs.python_version_tag }} \
            ./scripts/build_wheel.sh

      - name: Upload Python wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: mooncake-wheel-npu-pre-release-${{ matrix.arch }}-py${{ steps.generate_tag_release.outputs.python_version_tag }}
          path: mooncake-wheel/dist-npu-py${{ steps.generate_tag_release.outputs.python_version_tag }}/*.whl

  publish-github-release:
    name: Upload wheels to GitHub Pre-release
    needs: [build, build-npu]
    runs-on: ubuntu-22.04
    concurrency:
      group: pre-release-github-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download all pre-release wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: mooncake-wheel/dist-release
          pattern: mooncake-wheel*pre-release*
          merge-multiple: true

      - name: Upload wheels to GitHub Pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          files: mooncake-wheel/dist-release/*.whl
          fail_on_unmatched_files: true

  publish-testpypi:
    name: Validate and publish wheels to TestPyPI
    needs: [version-stamp, build, build-npu]
    runs-on: ubuntu-22.04
    environment: nightly
    concurrency:
      group: pre-release-testpypi-${{ needs.version-stamp.outputs.package_version }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      PACKAGE_VERSION: ${{ needs.version-stamp.outputs.package_version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download all pre-release wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: mooncake-wheel/dist-all
          pattern: mooncake-wheel*pre-release*

      - name: Collect wheels for publication
        run: |
          mkdir -p mooncake-wheel/dist-release
          find mooncake-wheel/dist-all -name "*.whl" \
            -exec cp {} mooncake-wheel/dist-release/ \;
          echo "Pre-release tag: ${GITHUB_REF_NAME}"
          echo "Package version: ${PACKAGE_VERSION}"
          echo "Collected wheels:"
          ls -la mooncake-wheel/dist-release/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publication tools
        run: python -m pip install packaging twine

      - name: Require TestPyPI credentials
        env:
          TESTPYPI_API_TOKEN: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          if [ -z "$TESTPYPI_API_TOKEN" ]; then
            echo "TESTPYPI_API_TOKEN is required"
            exit 1
          fi

      - name: Validate wheels with twine
        run: twine check mooncake-wheel/dist-release/*.whl

      - name: Validate empty or resumable TestPyPI upload state
        run: |
          python scripts/ci/testpypi_wheel_gate.py validate-upload-state \
            --directory mooncake-wheel/dist-release \
            --version "$PACKAGE_VERSION"

      - name: Publish exact wheels to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: >-
          twine upload --repository testpypi --skip-existing
          mooncake-wheel/dist-release/*.whl

      - name: Verify every published wheel hash
        run: |
          python scripts/ci/testpypi_wheel_gate.py wait-upload-state \
            --directory mooncake-wheel/dist-release \
            --version "$PACKAGE_VERSION"

  consume-testpypi:
    name: Consume ${{ matrix.package }} on ${{ matrix.architecture }}
    needs: [version-stamp, publish-testpypi]
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - mooncake-transfer-engine
          - mooncake-transfer-engine-cuda13
          - mooncake-transfer-engine-non-cuda
        architecture:
          - x86_64
          - aarch64
    env:
      PACKAGE_VERSION: ${{ needs.version-stamp.outputs.package_version }}
      TARGET_PACKAGE: ${{ matrix.package }}
    steps:
      - name: Install CUDA runtime and driver stub
        if: ${{ matrix.package != 'mooncake-transfer-engine-non-cuda' }}
        env:
          CUDA_PACKAGE_VERSION: ${{ matrix.package == 'mooncake-transfer-engine-cuda13' && '13-0' || '12-8' }}
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = x86_64 ]; then
            repository_architecture=x86_64
          else
            repository_architecture=sbsa
          fi
          keyring=$(mktemp --suffix=.deb)
          curl --fail --location --retry 3 \
            "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/${repository_architecture}/cuda-keyring_1.1-1_all.deb" \
            --output "$keyring"
          sudo dpkg -i "$keyring"
          sudo apt-get update
          sudo apt-get install -y \
            "cuda-cudart-${CUDA_PACKAGE_VERSION}" \
            "cuda-driver-dev-${CUDA_PACKAGE_VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download, install, and smoke the indexed wheel
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4 libibverbs1 rdma-core librdmacm1 libnuma1 liburing2

          download_dir=$(mktemp -d)

          python -m pip download \
            --index-url https://test.pypi.org/simple \
            --no-cache-dir \
            --no-deps \
            --only-binary=:all: \
            --pre \
            --dest "$download_dir" \
            "${TARGET_PACKAGE}==${PACKAGE_VERSION}"

          # Install the wheel downloaded above. Its ordinary dependencies are
          # resolved from production PyPI, never TestPyPI.
          python -m pip install \
            --index-url https://pypi.org/simple \
            "$download_dir"/*.whl

          if [ "$TARGET_PACKAGE" != mooncake-transfer-engine-non-cuda ]; then
            cuda_stub=
            for candidate in /usr/local/cuda*/lib64/stubs/libcuda.so \
                             /usr/local/cuda*/targets/*/lib/stubs/libcuda.so; do
              if [ -f "$candidate" ]; then
                cuda_stub="$candidate"
                break
              fi
            done
            if [ -z "$cuda_stub" ]; then
              echo "CUDA driver stub libcuda.so was not found"
              exit 1
            fi
            stub_dir=$(mktemp -d)
            ln -s "$cuda_stub" "$stub_dir/libcuda.so.1"
            export LD_LIBRARY_PATH="$stub_dir:${LD_LIBRARY_PATH:-}"
            for directory in /usr/local/cuda*/lib64 \
                             /usr/local/cuda*/targets/*/lib; do
              if [ -d "$directory" ]; then
                export LD_LIBRARY_PATH="$directory:$LD_LIBRARY_PATH"
              fi
            done
          fi

          python - "$TARGET_PACKAGE" "$PACKAGE_VERSION" <<'PY'
          import importlib.metadata
          import sys

          package, expected = sys.argv[1:]
          installed = importlib.metadata.version(package)
          if installed != expected:
              raise SystemExit(
                  f"installed {package} version {installed}, expected {expected}"
              )

          import mooncake
          import mooncake.engine
          import mooncake.http_metadata_server
          import mooncake.store
          PY
          mooncake_http_metadata_server --help >/dev/null
          mooncake_master --version

  tone-integration:
    name: Validate T-one integration with TestPyPI wheel
    needs: [version-stamp, consume-testpypi]
    uses: ./.github/workflows/integration-test.yml
    with:
      testpypi_version: ${{ needs.version-stamp.outputs.package_version }}
    secrets: inherit
