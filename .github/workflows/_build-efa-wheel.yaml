name: _build-efa-wheel

# Shared AWS EFA wheel build used by pull-request CI and release workflows.
# EFA hardware is not required to build: libfabric is built from source purely
# to compile against, then auditwheel leaves libfabric/libefa to the system
# runtime -- so the wheel always uses the EFA installer's libfabric on the host.

on:
  workflow_call:
    inputs:
      variant:
        # cuda | cuda13 | non-cuda
        type: string
        required: true
      python-versions:
        # JSON array consumed by the called workflow's Python matrix.
        type: string
        required: true
      build-profile:
        # ci uses Ninja and CI diagnostics; release preserves the release make build.
        type: string
        required: true
      cmake-args:
        type: string
        required: true
      torch-cuda-arch-list:
        type: string
        default: ''
      artifact-prefix:
        type: string
        required: true

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    env:
      BUILD_PROFILE: ${{ inputs.build-profile }}
      CMAKE_ARGS: ${{ inputs.cmake-args }}
      EFA_VARIANT: ${{ inputs.variant }}
      USE_CUDA: ${{ inputs.variant != 'non-cuda' }}
      VARIANT_FLAG: ${{ fromJSON('{"cuda":"EFA_BUILD","cuda13":"EFA_CU13_BUILD","non-cuda":"EFA_NON_CUDA_BUILD"}')[inputs.variant] }}
      CUDA_VERSION: ${{ inputs.variant == 'cuda13' && '13.0.2' || '12.8.1' }}
      TORCH_CUDA_ARCH_LIST: ${{ inputs.torch-cuda-arch-list }}

    steps:
      - name: Validate build inputs
        run: |
          case "$BUILD_PROFILE" in
            ci|release) ;;
            *) echo "::error::Unknown EFA build profile: $BUILD_PROFILE"; exit 1 ;;
          esac

          case "$EFA_VARIANT" in
            cuda|cuda13|non-cuda) ;;
            *) echo "::error::Unknown EFA variant: $EFA_VARIANT"; exit 1 ;;
          esac
        shell: bash

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: ${{ inputs.build-profile == 'release' }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Free up disk space
        uses: ./.github/actions/free-disk-space

      - name: Install CUDA Toolkit
        if: ${{ inputs.variant != 'non-cuda' }}
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: 'network'
          sub-packages: '["nvcc", "nvrtc-dev"]'
          non-cuda-sub-packages: '["libcusparse-dev", "libcublas-dev", "libcusolver-dev"]'

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt update -y
          packages=()
          if [ "$BUILD_PROFILE" = ci ]; then
            packages=(ninja-build)
          fi
          if [ ${#packages[@]} -gt 0 ]; then
            sudo apt install -y "${packages[@]}"
          fi
          sudo bash -x dependencies.sh -y
          if [ "$BUILD_PROFILE" = ci ]; then
            df -h
          fi
        shell: bash

        # Built from source instead of taken from apt because the EFA transport
        # asks fi_getinfo() for FI_VERSION(1, 18) and needs FI_HMEM_NEURON
        # (libfabric >= 1.15) to register Neuron HBM, while Ubuntu 22.04 -- the
        # runner that fixes this wheel's glibc floor -- packages libfabric 1.11.
        # Pinned at the minimum the code actually claims to support, so the
        # headers cannot describe structures a supported runtime is too old to
        # provide; hosts run whatever libfabric the EFA installer put there.
        # Only headers and a link target are wanted, hence no providers.
      - name: Build libfabric
        env:
          LIBFABRIC_VERSION: '1.18.2'
        run: |
          workdir=$(mktemp -d)
          curl -fsSL -o "$workdir/libfabric.tar.bz2" \
            "https://github.com/ofiwg/libfabric/releases/download/v${LIBFABRIC_VERSION}/libfabric-${LIBFABRIC_VERSION}.tar.bz2"
          tar -xf "$workdir/libfabric.tar.bz2" -C "$workdir"
          cd "$workdir/libfabric-${LIBFABRIC_VERSION}"
          ./configure --prefix=/usr/local \
            --disable-efa --disable-verbs --disable-psm2 --disable-psm3 \
            --disable-opx --disable-shm --disable-rxm --disable-rxd \
            --disable-tcp --disable-udp --disable-sockets --disable-usnic \
            --disable-mrail
          make -j"$(nproc)"
          sudo make install
          grep -q FI_HMEM_NEURON /usr/local/include/rdma/fi_domain.h
        shell: bash

      - name: Configure project
        run: |
          generator=()
          if [ "$BUILD_PROFILE" = ci ]; then
            generator=(-G Ninja)
          fi

          cuda_args=(-DUSE_CUDA=OFF)
          if [ "$USE_CUDA" = true ]; then
            cuda_args=(
              -DUSE_CUDA=ON
              -DCMAKE_EXE_LINKER_FLAGS=-L/usr/local/cuda/lib64/stubs
            )
          fi

          read -r -a profile_args <<< "$CMAKE_ARGS"
          mkdir build
          cd build
          cmake "${generator[@]}" .. \
            -DUSE_EFA=ON \
            -DLIBFABRIC_INCLUDE_DIR=/usr/local/include \
            -DLIBFABRIC_LIBRARY=/usr/local/lib/libfabric.so \
            -DENABLE_SCCACHE=ON \
            -DCMAKE_BUILD_TYPE=Release \
            "${profile_args[@]}" \
            "${cuda_args[@]}"
        shell: bash

      - name: Build project
        run: |
          if [ "$USE_CUDA" = true ]; then
            export LD_LIBRARY_PATH=/usr/local/cuda/lib64/stubs:$LD_LIBRARY_PATH
            export LIBRARY_PATH=/usr/local/cuda/lib64/stubs:$LIBRARY_PATH
          fi

          cd build
          if [ "$BUILD_PROFILE" = release ]; then
            make -j3
            sudo make install
          else
            cmake --build .
            sudo cmake --install .
            df -h
          fi
        shell: bash

      - name: Run sccache stat for check
        if: ${{ env.SCCACHE_PATH != '' }}
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

      - name: Generate Python version tag
        id: python-tag
        run: |
          echo "python_version_tag=$(echo ${{ matrix.python-version }} | tr -d '.')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build Python wheel
        run: |
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
          export "$VARIANT_FLAG=1"
          PYTHON_VERSION=${{ matrix.python-version }} \
            OUTPUT_DIR=dist-py${{ steps.python-tag.outputs.python_version_tag }} \
            ./scripts/build_wheel.sh
        shell: bash

      - name: Verify libfabric is excluded from the wheel
        run: |
          WHL=$(ls mooncake-wheel/dist-py${{ steps.python-tag.outputs.python_version_tag }}/*.whl | head -1)
          echo "Inspecting $WHL"
          if unzip -l "$WHL" | grep -iE 'libfabric|libefa'; then
            echo "::error::libfabric/libefa must NOT be bundled in the EFA wheel"
            exit 1
          fi
          echo "OK: libfabric/libefa correctly excluded (resolve to system EFA at runtime)"
        shell: bash

      - name: Verify CUDA runtime dependency
        if: ${{ inputs.variant != 'non-cuda' }}
        run: |
          WHL=$(ls mooncake-wheel/dist-py${{ steps.python-tag.outputs.python_version_tag }}/*.whl | head -1)
          inspect_dir=$(mktemp -d)
          unzip -q "$WHL" mooncake/engine.so -d "$inspect_dir"
          cuda_major=${CUDA_VERSION%%.*}
          if ! readelf -d "$inspect_dir/mooncake/engine.so" | \
              grep -Fq "Shared library: [libcudart.so.${cuda_major}]"; then
            echo "::error::EFA wheel does not depend on libcudart.so.${cuda_major}"
            readelf -d "$inspect_dir/mooncake/engine.so" | grep NEEDED
            exit 1
          fi
          echo "OK: EFA wheel depends on libcudart.so.${cuda_major}"
        shell: bash

      - name: Upload Python wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-py${{ steps.python-tag.outputs.python_version_tag }}
          path: mooncake-wheel/dist-py${{ steps.python-tag.outputs.python_version_tag }}/*.whl
