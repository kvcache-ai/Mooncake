name: Release

on:
  push:
    # Stable tags only (vX.Y.Z or vX.Y.Z.postN). PEP 440 pre-release tags
    # such as v0.3.14rc1 must not reach production PyPI; pre-release.yaml
    # handles them. Any other form (v0.3.14a1, v0.3.14dev1, v0.3.14post1,
    # v0.3.14+local) matches no release workflow, so nothing runs: re-tag
    # in one of the forms above instead of pushing the same tag again.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.post[0-9]+'

jobs:
  # Skip semver pre-release tags (e.g. v1.0.0-rc1); those are handled by pre-release.yaml.
  build:
    if: ${{ !contains(github.ref_name, '-') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            artifact-prefix: mooncake-wheel
          - architecture: arm64
            artifact-prefix: mooncake-wheel-arm64
    uses: ./.github/workflows/_build-wheel.yaml
    with:
      architecture: ${{ matrix.architecture }}
      artifact-prefix: ${{ matrix.artifact-prefix }}

  publish-release:
    needs: build
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/_publish-wheel.yaml
    with:
      artifact-pattern: 'mooncake-wheel*'
    secrets:
      pypi-token: ${{ secrets.PYPI_API_TOKEN }}
