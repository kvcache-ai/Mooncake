[package]
name = "mooncake_store"
version = "0.1.0"
edition = "2021"
description = "Rust bindings for the Mooncake distributed KV cache store"
license = "Apache-2.0"

[lib]
name = "mooncake_store"
# rlib for use as a Rust dependency, cdylib if a shared-library artifact is needed
crate-type = ["rlib"]

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[features]
default = ["link"]
# Statically link `libmooncake_store` at build time. build.rs generates the FFI
# with bindgen and links the Mooncake C++ static-library graph, so a built
# Mooncake tree (libraries + `store_c.h`) must be present at build time. This is
# the historical behavior.
link = ["dep:bindgen"]
# Load `libmooncake_store.so` at run time via `dlopen`. build.rs still runs
# bindgen to generate the loader from `store_c.h` (so the ABI is not hand-written),
# but links no C++ libraries: only the header + libclang are needed to build, and
# only libloading + the shared library at run time. See `src/ffi_dlopen.rs`.
dlopen = ["dep:bindgen", "dep:libloading"]

[dependencies]
thiserror = "2.0"
libc = "0.2"
libloading = { version = "0.8", optional = true }

# bindgen is used by both backends (static bindings for `link`, a dynamic-loading
# loader for `dlopen`); optional so a no-feature build does not pull it in.
[build-dependencies]
bindgen = { version = "0.70", optional = true }
