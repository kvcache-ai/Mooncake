[package]
name = "mooncake_store"
version = "0.1.0"
edition = "2021"
description = "Rust bindings for the Mooncake distributed KV cache store"
license = "Apache-2.0"

[lib]
name = "mooncake_store"
# rlib for use as a Rust dependency, cdylib if a shared-library artifact is needed
crate-type = ["rlib"]

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

# Maintainer tool: regenerates src/generated/ffi_dlopen_bindings.rs from
# store_c.h. Gated on `link` so it (and its bindgen dep) are not built for a
# plain `dlopen` build. Run via `cargo run --example generate_dlopen_bindings`.
[[example]]
name = "generate_dlopen_bindings"
path = "examples/generate_dlopen_bindings.rs"
required-features = ["link"]

[features]
default = ["link"]
# Link the canonical `libmooncake_store.so` SDK at build time. build.rs
# generates the FFI with bindgen; callers need only the shared library and
# `store_c.h`, not its C++ dependency graph.
link = ["dep:bindgen"]
# Load `libmooncake_store.so` at run time via `dlopen`. Uses committed,
# pre-generated bindings (src/generated/ffi_dlopen_bindings.rs), so a consumer
# needs only `libloading` — no bindgen, header, or libclang, and no C++ linking.
dlopen = ["dep:libloading"]

[dependencies]
thiserror = "2.0"
libc = "0.2"
libloading = { version = "0.8", optional = true }

# bindgen: build-dep for the `link` backend's static bindings; dev-dep for the
# generate_dlopen_bindings example. The `dlopen` backend needs neither.
[build-dependencies]
bindgen = { version = "0.70", optional = true }

[dev-dependencies]
bindgen = "0.70"
