[package]
name = "mooncake-store-py"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "_store_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
clap.workspace = true
ctrlc.workspace = true
libc = "0.2"
mooncake-metadata = { path = "../mooncake-metadata" }
mooncake-store-client = { path = "../mooncake-store-client" }
mooncake-store-core = { path = "../mooncake-store-core" }
mooncake-transport = { path = "../mooncake-transport" }
parking_lot.workspace = true
pyo3.workspace = true
prost = "0.13"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tonic = { version = "0.12", features = ["transport"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
redis = "0.27"

[lints]
workspace = true
