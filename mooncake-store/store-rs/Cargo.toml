[workspace]
members = [
    "crates/mooncake-transport-sys",
    "crates/mooncake-transport",
    "crates/mooncake-store-core",
    "crates/mooncake-metadata",
    "crates/mooncake-store-client",
    "crates/mooncake-store-e2e",
    "crates/mooncake-store-py",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
parking_lot = "0.12"
pyo3 = { version = "0.24", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
