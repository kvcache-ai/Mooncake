[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "mooncake-store-rs"
version = "0.1.0"
description = "Masterless Rust implementation of the Mooncake Store, with an opt-in drop-in for the mooncake.store API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "Xingrui Yi", email = "yixingrui@linux.alibaba.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: Apache Software License",
]
keywords = ["mooncake", "store", "rust", "distributed-cache"]
dependencies = [
    "aiohttp",
    "numpy",
    "requests",
]

[project.urls]
Homepage = "https://github.com/kvcache-ai/Mooncake"
Source = "https://github.com/kvcache-ai/Mooncake"

[project.optional-dependencies]
rl = [
    "torch>=2.5.0",
]
dev = [
    "ruff>=0.6",
]

[project.scripts]
# Only store-rs-specific entry points live here. The upstream
# `mooncake-transfer-engine` wheel owns `transfer_engine_bench`,
# `mooncake_http_metadata_server`, `mc_store_rest_server`,
# `transfer_engine_topology_dump`, `mooncake_master` and `mooncake_client`;
# redeclaring any of those would have the last-installed wheel silently win.
mooncake-store-client = "mooncake_store_rs.cli:main"
mooncake-store-admin = "mooncake_store_rs.cli:main"
mooncake-store-bench = "mooncake_store_rs.cli:main"

[tool.maturin]
manifest-path = "crates/mooncake-store-py/Cargo.toml"
python-source = "python"
module-name = "mooncake_store_rs._store_rs"
bindings = "pyo3"
