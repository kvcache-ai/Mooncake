[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "mooncake"
version = "1.0.0+pro.1"
description = "Mooncake Pro distribution with Rust store and upstream transfer engine compatibility"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "Xingrui Yi", email = "yixingrui@linux.alibaba.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: Apache Software License",
]
keywords = ["mooncake", "store", "rust", "distributed-cache"]
dependencies = [
    "aiohttp",
    "numpy",
    "requests",
]

[project.urls]
Homepage = "https://github.com/kvcache-ai/Mooncake"
Source = "https://github.com/kvcache-ai/Mooncake"

[project.optional-dependencies]
rl = [
    "torch>=2.5.0",
]
dev = [
    "ruff>=0.6",
]

[project.scripts]
transfer_engine_bench = "mooncake.cli:main"
mooncake-store-client = "mooncake.cli:main"
mooncake-store-admin = "mooncake.cli:main"
mooncake-store-bench = "mooncake.cli:main"
mooncake_http_metadata_server = "mooncake.http_metadata_server:main"
mc_store_rest_server = "mooncake.mooncake_store_service:main"
transfer_engine_topology_dump = "mooncake.transfer_engine_topology_dump:main"

[tool.maturin]
manifest-path = "crates/mooncake-store-py/Cargo.toml"
python-source = "python"
module-name = "mooncake._store_rs"
bindings = "pyo3"
