[package]
name = "mooncake-store-e2e"
version = "0.1.0"
edition = "2021"
default-run = "mooncake-store-e2e"

[features]
default = []
nof-spdk = ["mooncake-store-client/nof-spdk"]

[[bin]]
name = "nof_multi_client"
path = "src/bin/nof_multi_client.rs"
required-features = ["nof-spdk"]

[dependencies]
mooncake-store-rs-metadata = { path = "../mooncake-store-rs-metadata" }
mooncake-store-client = { path = "../mooncake-store-client" }
mooncake-store-core = { path = "../mooncake-store-core" }
mooncake-store-rs-transport = { path = "../mooncake-store-rs-transport" }
redis = "0.27"

[lints]
workspace = true
