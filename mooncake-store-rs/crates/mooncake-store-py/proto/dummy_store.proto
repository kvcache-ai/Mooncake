syntax = "proto3";

package mooncake.store.dummy;

service DummyStoreService {
  rpc Health(HealthRequest) returns (HealthReply);
  rpc Put(PutRequest) returns (StatusReply);
  rpc Get(GetRequest) returns (GetReply);
  rpc AcquireHotCache(HotCacheAcquireRequest) returns (HotCacheAcquireReply);
  rpc ReleaseHotCache(HotCacheReleaseRequest) returns (StatusReply);
  rpc BatchAcquireHotCache(BatchHotCacheAcquireRequest) returns (BatchHotCacheAcquireReply);
  rpc BatchReleaseHotCache(BatchHotCacheReleaseRequest) returns (StatusReply);
  rpc BatchIsExist(BatchIsExistRequest) returns (BatchIsExistReply);
  rpc BatchPutFrom(BatchPutFromRequest) returns (BatchStatusReply);
  rpc BatchPutFromMultiBuffers(BatchPutFromMultiBuffersRequest) returns (BatchStatusReply);
  rpc BatchGetInto(BatchGetIntoRequest) returns (BatchGetIntoReply);
  rpc BatchGetIntoMultiBuffers(BatchGetIntoMultiBuffersRequest) returns (BatchGetIntoReply);
  rpc RemoveAll(RemoveAllRequest) returns (RemoveAllReply);
  rpc UnregisterRegion(UnregisterRegionRequest) returns (StatusReply);
}

message HealthRequest {}

message HealthReply {
  int32 status = 1;
}

message StatusReply {
  int32 status = 1;
}

message RemoveAllRequest {
  bool force = 1;
}

message RemoveAllReply {
  int32 status = 1;
  int64 removed = 2;
}

message GetRequest {
  string key = 1;
  string tenant = 2;
}

message GetReply {
  int32 status = 1;
  bytes value = 2;
}

message HotCacheAcquireRequest {
  string key = 1;
  string tenant = 2;
}

message HotCacheAcquireReply {
  int32 status = 1;
  uint64 offset = 2;
  uint64 length = 3;
  uint64 block_id = 4;
  uint64 generation = 5;
}

message HotCacheReleaseRequest {
  uint64 block_id = 1;
  uint64 generation = 2;
}

message BatchHotCacheAcquireRequest {
  repeated ObjectRef objects = 1;
}

message BatchHotCacheAcquireReply {
  repeated HotCacheAcquireReply items = 1;
}

message BatchHotCacheReleaseRequest {
  repeated HotCacheReleaseRequest handles = 1;
}

message ReplicationPolicy {
  uint32 replica_count = 1;
  repeated string preferred_segments = 2;
  repeated string preferred_storage_owners = 3;
  bool prefer_local = 4;
  bool prefer_alloc_in_same_node = 5;
  bool with_soft_pin = 6;
}

message PutRequest {
  string key = 1;
  string tenant = 2;
  bytes value = 3;
  ReplicationPolicy replication = 4;
}

message ObjectRef {
  string key = 1;
  string tenant = 2;
}

message BatchIsExistRequest {
  repeated ObjectRef objects = 1;
}

message BatchIsExistReply {
  repeated int32 statuses = 1;
}

message SharedBufferRef {
  uint64 region_id = 1;
  uint64 offset = 2;
  uint64 length = 3;
}

message SharedPutItem {
  string key = 1;
  SharedBufferRef buffer = 2;
}

message BatchPutFromRequest {
  uint64 client_id_hi = 1;
  uint64 client_id_lo = 2;
  string tenant = 3;
  ReplicationPolicy replication = 4;
  repeated SharedPutItem items = 5;
}

message BatchStatusReply {
  repeated int32 statuses = 1;
}

message SharedBufferGroup {
  repeated SharedBufferRef buffers = 1;
}

message SharedMultiPutItem {
  string key = 1;
  SharedBufferGroup buffers = 2;
}

message BatchPutFromMultiBuffersRequest {
  uint64 client_id_hi = 1;
  uint64 client_id_lo = 2;
  string tenant = 3;
  ReplicationPolicy replication = 4;
  repeated SharedMultiPutItem items = 5;
}

message SharedGetItem {
  string key = 1;
  SharedBufferRef buffer = 2;
}

message BatchGetIntoRequest {
  uint64 client_id_hi = 1;
  uint64 client_id_lo = 2;
  string tenant = 3;
  repeated SharedGetItem items = 4;
}

message BatchGetIntoReply {
  repeated int64 lengths = 1;
}

message SharedMultiGetItem {
  string key = 1;
  SharedBufferGroup buffers = 2;
}

message BatchGetIntoMultiBuffersRequest {
  uint64 client_id_hi = 1;
  uint64 client_id_lo = 2;
  string tenant = 3;
  repeated SharedMultiGetItem items = 4;
}

message UnregisterRegionRequest {
  uint64 client_id_hi = 1;
  uint64 client_id_lo = 2;
  uint64 region_id = 3;
}
